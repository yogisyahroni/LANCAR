name: Fix order-service broken tests
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/tmp-fix-order-service-tests.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Sync staging
        run: git pull --ff-only origin staging
      - name: Patch websocket contract and handoff test fixture
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python3 /tmp/repair.py
      - name: Go format
        run: |
          cd backend/order-service
          gofmt -w internal/handler/websocket_handler.go internal/service/handoff_service_test.go
      - name: Run order-service package tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          cd backend/order-service
          set +e
          {
            echo '== handler package =='
            go test ./internal/handler
            handler_status=$?
            echo '== service package =='
            go test ./internal/service
            service_status=$?
            echo '== cmd/api compile =='
            go test ./cmd/api -run '^$'
            api_status=$?
            if [ "$handler_status" -ne 0 ] || [ "$service_status" -ne 0 ] || [ "$api_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee "$RUNNER_TEMP/order-service-fix.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-broken-test-diagnostics
          path: ${{ runner.temp }}/order-service-fix.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop on test failure
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Commit and push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-order-service-tests.yml
          git add backend/order-service/internal/handler/websocket_handler.go backend/order-service/internal/service/handoff_service_test.go
          git commit -m 'fix: restore realtime contract and handoff test fixture'
          for attempt in 1 2 3; do
            git pull --rebase origin staging
            if git push origin HEAD:staging; then exit 0; fi
            sleep 2
          done
          exit 1
