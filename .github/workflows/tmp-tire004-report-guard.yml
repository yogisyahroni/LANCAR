name: Apply TIRE-2026-004 report guard once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/tmp-tire004-report-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/order-service/go.mod
          cache-dependency-path: backend/order-service/go.sum
      - name: Apply staged patch
        run: python3 .github/scripts/tmp_tire004_report_guard.py
      - name: Format Go
        run: gofmt -w backend/order-service/internal/domain/tambalban_lifecycle.go backend/order-service/internal/repository/tambalban_repository.go
      - name: Validate order service
        working-directory: backend/order-service
        run: |
          go test ./internal/domain
          go test ./internal/repository
          go test ./internal/service
      - name: Remove one-shot patch assets
        run: rm -f .github/scripts/tmp_tire004_report_guard.py .github/workflows/tmp-tire004-report-guard.yml
      - name: Commit directly to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: bind tambal ban report to assigned technician'
          git push origin HEAD:staging
