name: Task Evidence Gate

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-task-evidence:
    name: Validate master task evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate task evidence
        run: python3 scripts/tasks/validate_task_evidence.py
