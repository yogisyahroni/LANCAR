name: TIRE004 structured report wiring
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/tmp-tire004-report-wiring.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Sync latest staging
        run: git pull --ff-only origin staging
      - name: Patch mobile report wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          vm = 'android-app/app/src/main/java/com/tembus/courier/ui/screens/service/TambalBanFlowViewModel.kt'
          replace_once(vm,
              'inspectionBeforePhotoUrl = proofDraftStore.getBeforePhotoUrl(orderId, "tambal_ban"),\n                                                earnings = EarningsData(',
              'inspectionBeforePhotoUrl = proofDraftStore.getBeforePhotoUrl(orderId, "tambal_ban"),\n                                                damageType = proofDraftStore.getTireDamageType(orderId) ?: it.damageType,\n                                                materialsUsedItems = proofDraftStore.getMaterialsUsed(orderId),\n                                                earnings = EarningsData(')
          replace_once(vm,
              '''    fun setDamageType(damageType: String) {\n        _uiState.update { it.copy(damageType = damageType) }\n    }\n\n    fun setMaterialsUsed(materials: List<String>) {\n        _uiState.update { it.copy(materialsUsedItems = materials.distinct()) }\n    }''',
              '''    fun setDamageType(damageType: String) {\n        val normalized = damageType.trim()\n        _uiState.update { it.copy(damageType = normalized) }\n        if (orderId.isNotBlank()) proofDraftStore.saveTireDamageType(orderId, normalized)\n    }\n\n    fun setMaterialsUsed(materials: List<String>) {\n        val normalized = materials.map(String::trim).filter(String::isNotBlank).distinct()\n        _uiState.update { it.copy(materialsUsedItems = normalized) }\n        if (orderId.isNotBlank()) proofDraftStore.saveMaterialsUsed(orderId, normalized)\n    }''')
          replace_once(vm,
              '''            val photoUrl = uploadResult.getOrNull().orEmpty()\n            proofDraftStore.saveBeforePhotoUrl(orderId, "tambal_ban", photoUrl)\n            orderRepository.updateOrderStatus(orderId, "in_progress")\n            loadOrder(orderId)''',
              '''            val photoUrl = uploadResult.getOrNull().orEmpty()\n            proofDraftStore.saveBeforePhotoUrl(orderId, "tambal_ban", photoUrl)\n            orderRepository.updateOrderStatus(orderId, "in_progress")\n            if (proofDraftStore.getServiceStartedAtMillis(orderId, "tambal_ban") == null) {\n                proofDraftStore.saveServiceStartedAtMillis(orderId, "tambal_ban", System.currentTimeMillis())\n            }\n            loadOrder(orderId)''')

          screen = 'android-app/app/src/main/java/com/tembus/courier/ui/screens/service/TambalBanFlowScreen.kt'
          replace_once(screen,
              '    var pendingCriticalAction by remember { mutableStateOf<TambalBanNextActionType?>(null) }\n\n    // Auto-navigate',
              '''    var pendingCriticalAction by remember { mutableStateOf<TambalBanNextActionType?>(null) }\n\n    LaunchedEffect(uiState.damageType) {\n        uiState.damageType?.let { selectedDamage = it }\n    }\n    LaunchedEffect(uiState.materialsUsedItems) {\n        selectedMaterials = uiState.materialsUsedItems.toSet()\n    }\n\n    // Auto-navigate''')

          order_vm = 'android-app/app/src/main/java/com/tembus/courier/ui/screens/order/OrderViewModel.kt'
          replace_once(order_vm,
              '''            when (serviceType) {\n                "tambal_ban" -> {\n                    reportRequest["tire_photo_before_url"] = beforePhotoUrl\n                    reportRequest["tire_condition_before"] = "Foto inspeksi awal diambil di aplikasi kurir."\n                }\n                "towing" -> {''',
              '''            when (serviceType) {\n                "tambal_ban" -> {\n                    val damageType = proofDraftStore.getTireDamageType(orderId)\n                    if (damageType.isNullOrBlank()) {\n                        _error.update { "Jenis kondisi/kerusakan ban dari inspeksi awal belum tersimpan. Kembali ke tahap inspeksi." }\n                        return@launch\n                    }\n                    val durationMinutes = com.tembus.courier.domain.calculateTambalBanDurationMinutes(\n                        proofDraftStore.getServiceStartedAtMillis(orderId, serviceType),\n                        System.currentTimeMillis()\n                    )\n                    if (durationMinutes == null) {\n                        _error.update { "Durasi pengerjaan belum valid. Mulai layanan dari tahap inspeksi atau hubungi dukungan jika pekerjaan melebihi 24 jam." }\n                        return@launch\n                    }\n                    reportRequest["tire_photo_before_url"] = beforePhotoUrl\n                    reportRequest["tire_condition_before"] = damageType\n                    reportRequest["service_duration_minutes"] = durationMinutes\n                    reportRequest["materials_used_items"] = proofDraftStore.getMaterialsUsed(orderId)\n                    reportRequest["tire_condition_after"] = "repair_completed_verified_by_after_photo"\n                }\n                "towing" -> {''')
          replace_once(order_vm,
              '''                        proofDraftStore.clearBeforePhotoUrl(orderId, serviceType)\n                        if (serviceType == "towing") {\n                            proofDraftStore.clearProofUrl(orderId, serviceType, "loading_photo")\n                            proofDraftStore.clearProofUrl(orderId, serviceType, "unloading_photo")\n                        }''',
              '''                        proofDraftStore.clearBeforePhotoUrl(orderId, serviceType)\n                        if (serviceType == "tambal_ban") {\n                            proofDraftStore.clearTambalBanStructuredDraft(orderId)\n                        } else if (serviceType == "towing") {\n                            proofDraftStore.clearProofUrl(orderId, serviceType, "loading_photo")\n                            proofDraftStore.clearProofUrl(orderId, serviceType, "unloading_photo")\n                        }''')
          PY
      - name: Commit and push safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tire004-report-wiring.yml
          git add android-app/app/src/main/java/com/tembus/courier/ui/screens/service/TambalBanFlowViewModel.kt \
            android-app/app/src/main/java/com/tembus/courier/ui/screens/service/TambalBanFlowScreen.kt \
            android-app/app/src/main/java/com/tembus/courier/ui/screens/order/OrderViewModel.kt
          git commit -m 'feat: persist structured tambal ban completion report'
          for attempt in 1 2 3; do
            git pull --rebase origin staging
            if git push origin HEAD:staging; then exit 0; fi
            sleep 2
          done
          exit 1
