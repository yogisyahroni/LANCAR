name: TIRE-2026-004 Targeted Gate

on:
  push:
    branches:
      - feat/tire-2026-004-closure
    paths:
      - 'backend/order-service/**'
      - 'android-app/**'
      - 'android-app-customer/**'
      - '.github/workflows/tire-2026-004-targeted.yml'
      - 'docs/task-evidence/TIRE-2026-004.md'
      - 'task-food-marketplace-parity-2026.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tire-2026-004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/order-service/go.mod
          cache-dependency-path: backend/order-service/go.sum

      - name: Verify Tambal Ban lifecycle domain
        working-directory: backend/order-service
        run: go test ./internal/domain -run 'Test(IsTambalBanService|ValidateTambalBanLifecycle)' -count=1 -v

      - name: Verify structured completion report
        working-directory: backend/order-service
        run: go test ./internal/service -run 'Test(ServiceReportRequiresTambalBanProofs|ServiceReportRequiresStructuredTambalBanFields|ServiceReportRejectsInvalidStructuredMaterials|CreateTambalBanReportEncodesStructuredMaterialsForLegacyStorage)' -count=1 -v

      - name: Verify completion report ownership and final-proof guard
        working-directory: backend/order-service
        run: go test ./internal/repository -run 'TestCreateTambalBanReport' -count=1 -v

      - name: Verify order-service wiring compiles
        working-directory: backend/order-service
        run: go test ./cmd/api -run '^$' -count=1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Prepare Firebase configs
        shell: bash
        env:
          COURIER_GOOGLE_SERVICES_JSON: ${{ secrets.COURIER_GOOGLE_SERVICES_JSON }}
          CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python scripts/mobile/validate_google_services.py \
            --raw-env COURIER_GOOGLE_SERVICES_JSON \
            --expected-package com.tembus.courier \
            --output android-app/app/google-services.json \
            --app-name Courier-App
          python scripts/mobile/validate_google_services.py \
            --raw-env CUSTOMER_GOOGLE_SERVICES_JSON \
            --expected-package com.tembus.customer \
            --output android-app-customer/app/google-services.json \
            --app-name Customer-App
          chmod 600 android-app/app/google-services.json android-app-customer/app/google-services.json

      - name: Verify courier Tambal Ban report policy
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.tembus.courier.domain.TambalBanReportPolicyTest' --stacktrace

      - name: Compile courier Android
        working-directory: android-app
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Verify customer Tambal Ban lifecycle labels
        working-directory: android-app-customer
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.tembus.customer.ui.screens.detail.OrderActionPolicyTest' --stacktrace

      - name: Compile customer Android status UI
        working-directory: android-app-customer
        run: ./gradlew compileDebugKotlin --stacktrace
