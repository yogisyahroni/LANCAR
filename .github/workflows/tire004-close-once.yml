name: Close TIRE-2026-004 once

on:
  push:
    branches: ["chore/tire-2026-004-closure"]
    paths:
      - '.github/workflows/tire004-close-once.yml'

permissions:
  contents: write

jobs:
  close-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tire-2026-004-closure
          fetch-depth: 0

      - name: Snapshot pre-existing global evidence debt
        shell: bash
        run: |
          set +e
          python3 scripts/tasks/validate_task_evidence.py >/tmp/evidence-before.out 2>/tmp/evidence-before.err
          echo $? >/tmp/evidence-before.status
          set -e
          grep '^- ' /tmp/evidence-before.err | LC_ALL=C sort -u >/tmp/evidence-before.errors || true
          echo "Baseline global gate status: $(cat /tmp/evidence-before.status)"

      - name: Mark only TIRE-2026-004 acceptance criteria complete
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('task-food-marketplace-parity-2026.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## TIRE-2026-004 — Arrival→inspection→repair→proof→completion [P0]'
          end_marker = '## TIRE-2026-005 — Settlement/warranty/claim/rating [P0]'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          targets = [
              '- [ ] Server-enforced lifecycle.',
              '- [ ] Before/after proof as configured.',
              '- [ ] Structured material/duration/report.',
              '- [ ] Customer sees human-readable stages.',
          ]
          for target in targets:
              if block.count(target) != 1:
                  raise SystemExit(f'Expected exactly one unchecked acceptance row: {target}')
              block = block.replace(target, target.replace('[ ]', '[x]'), 1)
          if '- [ ] ' in block:
              raise SystemExit('Unexpected unchecked checkbox remains in TIRE-2026-004 block')
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Write canonical TIRE-2026-004 evidence
        run: |
          cat > docs/task-evidence/TIRE-2026-004.md <<'EOF'
          ---
          task_id: TIRE-2026-004
          title: Arrival to inspection to repair to proof to completion
          status: COMPLETE
          reality_2026_003: PASS
          reality_2026_011: PASS
          implementation_ref: "8e7255e28700db5c95b3bf16ae265c7980bf81d3; 993b39258de6fdf40c6e242874d1923d1f38977a; 104c44f3fad9ff269d3a5bef57813e2233c02ccb; b8c1a06d2e92aa543a5cbf2272b2a95653c6903d; 8d76c6eeb1052341a4bdea481f83b7d254347341; f312d61d5e0c18de541cc0855063bff5cce1a3ea"
          tests: PASS
          integration: PASS
          e2e: N/A
          e2e_na_reason: "Original TIRE-2026-004 requires lifecycle/proof/report/stage contracts; authenticated physical-device UAT is a release follow-up."
          migration: N/A
          migration_na_reason: "TIRE-2026-004 introduces no task-local schema migration; it hardens the existing Tambal Ban report/order storage contract."
          observability: N/A
          observability_na_reason: "The source acceptance criteria introduce no new task-local telemetry requirement."
          security_privacy: PASS
          rollback_recovery: PASS
          task_scope_external_proof_required: false
          external_runtime_validation: NOT_RUN
          release_readiness: NOT_RUN
          release_followups: "Run authenticated customer/courier physical-device UAT and production-equivalent camera/media object-storage validation."
          unproven_requirements: "NONE"
          known_blockers: NONE
          locally_actionable_remaining: "NONE"
          blocker_resolution_attempts: "Re-verified current staging ancestry with dedicated backend, courier, and customer TIRE-2026-004 contracts."
          unblock_condition: "NONE"
          owner_action_required: false
          owner_action_summary: NONE
          verification_after_unblock: NONE
          dependency_chain_blocked: false
          next_eligible_task: TIRE-2026-005
          updated_at: "2026-09-06"
          ---

          # Evidence — TIRE-2026-004

          ## Acceptance Criteria Source

          - `[x] Server-enforced lifecycle.`
          - `[x] Before/after proof as configured.`
          - `[x] Structured material/duration/report.`
          - `[x] Customer sees human-readable stages.`

          ## Scope Implemented

          - Server accepts completion only through the Tambal Ban lifecycle, assigned-technician ownership, final-proof-compatible state, transaction/locking, and idempotent report replay.
          - Reports require before/after proof URLs, before/after condition, bounded duration, structured materials, and completion timestamp.
          - Courier policy validates service duration and the wired flow carries structured inspection/proof data into completion.
          - Customer order detail maps Tambal Ban states to human-readable arrival, inspection, repair, final-proof, and completed stages.

          ## Files Changed

          Verified implementation includes `backend/order-service/internal/domain/tambalban_lifecycle.go`, `internal/repository/tambalban_repository.go`, `internal/service/service_report_service.go`, courier `TambalBanReportPolicy.kt`/Tambal Ban flow screens, and customer `OrderActionPolicy.kt`/`OrderDetailScreen.kt`. This closure adds `docs/task-evidence/TIRE-2026-004.md` and marks the four source rows complete.

          ## Commands / Checks Run

              Verify TIRE-2026-004 — run 34028211988
              PASS: backend lifecycle/report tests + repository/handler compile
              PASS: courier TambalBanReportPolicyTest
              PASS: customer OrderDetailPolicyTest including Tambal Ban stage labels

          The earlier exploratory run `34028140193` used an over-broad backend package sweep and failed; it is not used as completion evidence. The isolated task-local run above is green.

          ## Task-Local Verification

          ### Tests
          PASS — all three task-local jobs in run `34028211988` completed successfully.

          ### Integration
          PASS — current repository/handler wiring compiles and both Android contract suites compile against current production sources.

          ### E2E
          N/A — physical-device authenticated UAT is retained as a release follow-up, not fabricated as task-local evidence.

          ### Migration
          N/A — no task-local schema migration is required.

          ### Observability
          N/A — no new task-local telemetry criterion exists.

          ### Security / Privacy
          PASS — report persistence verifies the assigned first-leg technician; customer report reads are ownership-scoped.

          ### Rollback / Recovery
          PASS — persistence is transactional, concurrent attempts are serialized, and replay returns the existing report rather than inserting a duplicate.

          ## Reality Gate Evaluation

          ### REALITY-2026-003 — Evidence-based Definition of Done
          PASS — implementation exists in current staging ancestry and backend/courier/customer task-local verification is green.

          ### REALITY-2026-011 — No Fake Completeness
          PASS — lifecycle, ownership, proof, duration/material structure, idempotency, and customer labels are enforced/tested; device and production media validation are explicitly not claimed.

          ## Unproven / Remaining

          NONE for the original TIRE-2026-004 scope. Physical-device/media validation remains a release/UAT follow-up.

          ## Next Eligible Task

          TIRE-2026-005
          EOF

      - name: Validate TIRE-2026-004 with repository validator rules
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          module_path = Path('scripts/tasks/validate_task_evidence.py')
          spec = importlib.util.spec_from_file_location('task_evidence_validator', module_path)
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          tasks = validator.parse_master(Path('task-food-marketplace-parity-2026.md'))
          task = tasks['TIRE-2026-004']
          if not task.complete_in_master:
              raise SystemExit(f'TIRE-2026-004 master closure is not complete: {task.checked_boxes}/{task.total_boxes}')

          errors, warnings = [], []
          validator.validate_evidence(task, Path('docs/task-evidence/TIRE-2026-004.md'), errors, warnings)
          for warning in warnings:
              print('WARNING:', warning)
          if errors:
              for error in errors:
                  print('ERROR:', error)
              raise SystemExit(1)
          print('TIRE-2026-004 task-local evidence validation PASSED')
          PY

      - name: Prove closure adds no global evidence errors
        shell: bash
        run: |
          set +e
          python3 scripts/tasks/validate_task_evidence.py >/tmp/evidence-after.out 2>/tmp/evidence-after.err
          echo $? >/tmp/evidence-after.status
          set -e
          grep '^- ' /tmp/evidence-after.err | LC_ALL=C sort -u >/tmp/evidence-after.errors || true
          echo "Post-closure global gate status: $(cat /tmp/evidence-after.status)"
          diff -u /tmp/evidence-before.errors /tmp/evidence-after.errors
          echo 'No new global evidence error introduced by TIRE-2026-004.'

      - name: Remove temporary TIRE-2026-004 workflows
        run: rm -f .github/workflows/tire004-close-once.yml .github/workflows/verify-tire-2026-004.yml

      - name: Commit closure to scoped branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(TIRE-2026-004): close lifecycle task with evidence'
          git push origin HEAD:chore/tire-2026-004-closure
