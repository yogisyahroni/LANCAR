          ## Next Eligible Task

          TIRE-2026-005
          EOF

      - name: Validate task evidence contract
        run: python3 scripts/tasks/validate_task_evidence.py

      - name: Remove temporary TIRE-2026-004 workflows
        run: rm -f .github/workflows/tire004-close-once.yml .github/workflows/verify-tire-2026-004.yml

      - name: Commit closure to scoped branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(TIRE-2026-004): close lifecycle task with evidence'
          git push origin HEAD:chore/tire-2026-004-closure
