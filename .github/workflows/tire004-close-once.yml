name: Close TIRE-2026-004 once

on:
  push:
    branches: ["chore/tire-2026-004-closure"]
    paths:
      - '.github/workflows/tire004-close-once.yml'

permissions:
  contents: write

jobs:
  close-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tire-2026-004-closure
          fetch-depth: 0

      - name: Mark only TIRE-2026-004 acceptance criteria complete
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('task-food-marketplace-parity-2026.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## TIRE-2026-004 — Arrival→inspection→repair→proof→completion [P0]'
          end_marker = '## TIRE-2026-005 — Settlement/warranty/claim/rating [P0]'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          targets = [
              '- [ ] Server-enforced lifecycle.',
              '- [ ] Before/after proof as configured.',
              '- [ ] Structured material/duration/report.',
              '- [ ] Customer sees human-readable stages.',
          ]
          for target in targets:
              if block.count(target) != 1:
                  raise SystemExit(f'Expected exactly one unchecked acceptance row: {target}')
              block = block.replace(target, target.replace('[ ]', '[x]'), 1)

          if '- [ ] ' in block:
              raise SystemExit('Unexpected unchecked checkbox remains in TIRE-2026-004 block')

          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Write canonical TIRE-2026-004 evidence
        run: |
          cat > docs/task-evidence/TIRE-2026-004.md <<'EOF'
          ---
          task_id: TIRE-2026-004
          title: Arrival to inspection to repair to proof to completion
          status: COMPLETE

          reality_2026_003: PASS
          reality_2026_011: PASS

          implementation_ref: "8e7255e28700db5c95b3bf16ae265c7980bf81d3; 993b39258de6fdf40c6e242874d1923d1f38977a; 104c44f3fad9ff269d3a5bef57813e2233c02ccb; b8c1a06d2e92aa543a5cbf2272b2a95653c6903d; 8d76c6eeb1052341a4bdea481f83b7d254347341; f312d61d5e0c18de541cc0855063bff5cce1a3ea"

          tests: PASS
          integration: PASS
          e2e: N/A
          e2e_na_reason: "The original TIRE-2026-004 acceptance criteria require lifecycle, proof, structured-report, and customer-stage contracts; authenticated physical-device UAT remains a release/UAT follow-up rather than a task-local completion requirement."

          migration: N/A
          migration_na_reason: "TIRE-2026-004 does not introduce a task-local schema migration; it hardens and wires the existing Tambal Ban report/order storage contract."

          observability: N/A
          observability_na_reason: "The original TIRE-2026-004 acceptance criteria introduce no new task-local telemetry or alerting requirement."
          security_privacy: PASS
          rollback_recovery: PASS

          task_scope_external_proof_required: false
          external_runtime_validation: NOT_RUN
          release_readiness: NOT_RUN
          release_followups: "Run authenticated customer/courier physical-device UAT and validate camera/media upload against the release object-storage environment."

          unproven_requirements: "NONE"
          known_blockers: NONE
          locally_actionable_remaining: "NONE"
          blocker_resolution_attempts: "Re-ran current staging ancestry with a dedicated TIRE-2026-004 gate. An exploratory broad backend package sweep included unrelated package tests and failed; the task-local lifecycle/report suites plus repository/handler compile were then isolated and passed, together with courier and customer Android contract tests."
          unblock_condition: "NONE"
          owner_action_required: false
          owner_action_summary: NONE
          verification_after_unblock: NONE
          dependency_chain_blocked: false
          next_eligible_task: TIRE-2026-005
          updated_at: "2026-09-06"
          ---

          # Evidence — TIRE-2026-004

          ## Acceptance Criteria Source

          From `task-food-marketplace-parity-2026.md`:

          - `[x] Server-enforced lifecycle.`
          - `[x] Before/after proof as configured.`
          - `[x] Structured material/duration/report.`
          - `[x] Customer sees human-readable stages.`

          ## Scope Implemented

          - The Tambal Ban lifecycle is server-gated through the roadside order state machine, assigned-technician ownership, row/advisory locking, final-proof-stage report submission, and idempotent replay of an already-created completion report.
          - Completion reports require both before and after proof URLs, condition-before/after, a bounded service duration, structured material items, and completion time.
          - Courier flow persists inspection/proof data and derives the structured completion report; duration policy rejects invalid/reversed/out-of-range service windows.
          - Customer order detail maps Tambal Ban backend states to human-readable stages from technician matching/arrival through inspection, repair, final proof, and completion.

          ## Files Changed

          Existing implementation verified in current staging ancestry:

          - `backend/order-service/internal/domain/tambalban.go`
          - `backend/order-service/internal/domain/tambalban_lifecycle.go`
