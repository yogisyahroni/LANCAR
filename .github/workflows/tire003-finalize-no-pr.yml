name: TIRE-2026-003 Finalize No PR

on:
  push:
    branches:
      - feat/TIRE-2026-003-evidence-no-pr
    paths:
      - '.github/workflows/tire003-finalize-no-pr.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize master and evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          master = Path('task-food-marketplace-parity-2026.md')
          text = master.read_text(encoding='utf-8')
          old = '''- [ ] Initial quote snapshot.
          - [ ] Extra material/work becomes structured adjustment.
          - [ ] Customer explicitly approves price delta.
          - [ ] Approval + money + audit is atomic/idempotent.'''
          new = '''- [x] Initial quote snapshot. (`service_adjustments.initial_quote_id` + `initial_pricing_snapshot`)
          - [x] Extra material/work becomes structured adjustment. (server-validated structured items/delta)
          - [x] Customer explicitly approves price delta. (`RoadsideAdjustmentSection` consent + approve/reject API)
          - [x] Approval + money + audit is atomic/idempotent. (transaction + rollback + replay tests)'''
          if text.count(old) != 1:
              raise SystemExit(f'TIRE-003 master block count={text.count(old)}, expected 1')
          master.write_text(text.replace(old, new, 1), encoding='utf-8')

          evidence = Path('docs/task-evidence/TIRE-2026-003.md')
          ev = evidence.read_text(encoding='utf-8')
          needle = '''    workflow: CI/CD Staging — Migration Test run 34026510977
              result: TIRE-2026-003 migration `202609060900_add_service_adjustments.sql` applied successfully on a clean CI DB; the repository-wide job later failed on the separate `202609061430_roadside_aftercare.sql` dependency ordering issue.'''
          addition = needle + '''

              workflow: TIRE-2026-003 Migration Gate — run 34026921989
              result: PASS — clean DB migrated through `202609060900`, adjustment schema invariants passed, goose DOWN passed, and rollback removed `service_adjustments`.'''
          if needle not in ev:
              raise SystemExit('TIRE-003 evidence migration anchor missing')
          ev = ev.replace(needle, addition, 1)
          ev = ev.replace(
              'Evidence: clean CI database successfully applied `202609060900_add_service_adjustments.sql`; schema defines the quote snapshot, approval/rejection evidence, financial state, constraints, and proposal/decision idempotency keys.',
              'Evidence: targeted migration run 34026921989 migrated a clean CI database through `202609060900_add_service_adjustments.sql`, verified adjustment schema invariants, rolled the migration back with goose DOWN, and verified `service_adjustments` was removed.'
          )
          evidence.write_text(ev, encoding='utf-8')
          PY
      - name: Verify TIRE-003 master/evidence alignment
        run: |
          set -euo pipefail
          python3 scripts/tasks/validate_task_evidence.py > /tmp/evidence.log 2>&1 || true
          cat /tmp/evidence.log
          if grep -q 'TIRE-2026-003:' /tmp/evidence.log; then
            echo 'TIRE-2026-003 still appears in validator errors/warnings' >&2
            exit 1
          fi
          grep -q -- '- \[x\] Initial quote snapshot.' task-food-marketplace-parity-2026.md
          grep -q '^status: COMPLETE$' docs/task-evidence/TIRE-2026-003.md
          grep -q 'run 34026921989' docs/task-evidence/TIRE-2026-003.md
      - name: Remove temporary TIRE-003 workflows
        run: |
          rm -f .github/workflows/tire003-targeted-gate.yml
          rm -f .github/workflows/tire003-migration-gate.yml
          rm -f .github/workflows/tire003-finalize-no-pr.yml
      - name: Commit final TIRE-003 closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add task-food-marketplace-parity-2026.md docs/task-evidence/TIRE-2026-003.md .github/workflows
          git diff --cached --check
          git commit -m 'docs(TIRE-2026-003): close quote adjustment task'
          git push origin HEAD:feat/TIRE-2026-003-evidence-no-pr
