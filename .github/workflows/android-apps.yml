name: Mobile Apps CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - 'android-app-merchant/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging, production ]
  pull_request:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - 'android-app-merchant/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging, production ]


# Cancel in-progress runs on the same branch
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:

        include:
          - app_name: "Courier-App"
            app_slug: "courier"
            asset_prefix: "tembus-courier"
            working_dir: "android-app"
            needs_firebase: "true"
            needs_maps: "true"
            signing_required: "true"
          - app_name: "Customer-App"
            app_slug: "customer"
            asset_prefix: "tembus-customer"
            working_dir: "android-app-customer"
            needs_firebase: "true"
            needs_maps: "true"
            signing_required: "true"
          - app_name: "Merchant-App"
            app_slug: "merchant"
            asset_prefix: "tembus-merchant"
            working_dir: "android-app-merchant"
            needs_firebase: "false"
            needs_maps: "false"
            signing_required: "false"

    
    steps:
      - uses: actions/checkout@v4

      - name: Guard against Google Maps SDK residue
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'google_maps|GOOGLE_MAPS|maps\.googleapis\.com|routes\.googleapis\.com|GoogleMapCanvas|play-services-maps|com\.google\.maps\.android|com\.google\.android\.gms\.maps|google\.navigation' \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            android-app android-app-customer android-app-merchant scripts/mobile; then
            echo "Google Maps runtime or SDK residue detected. Firebase google-services and Play Services Location are allowed; Google Maps is not." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./${{ matrix.working_dir }}

      - name: Prepare Firebase config
        if: matrix.needs_firebase == 'true'
        shell: bash
        env:
          WORKING_DIR: ${{ matrix.working_dir }}
          COURIER_GOOGLE_SERVICES_JSON: ${{ secrets.COURIER_GOOGLE_SERVICES_JSON }}
          CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          case "${WORKING_DIR}" in
            android-app)
              secret_name="COURIER_GOOGLE_SERVICES_JSON"
              expected_package="com.tembus.courier"
              ;;
            android-app-customer)
              secret_name="CUSTOMER_GOOGLE_SERVICES_JSON"
              expected_package="com.tembus.customer"
              ;;
            *)
              echo "Unknown Android app directory: ${WORKING_DIR}" >&2
              exit 1
              ;;
          esac

          python scripts/mobile/validate_google_services.py \
            --raw-env "${secret_name}" \
            --expected-package "${expected_package}" \
            --output "${WORKING_DIR}/app/google-services.json" \
            --app-name "${{ matrix.app_name }}"

          chmod 600 "${{ matrix.working_dir }}/app/google-services.json"

      - name: Prepare release signing
        id: prepare_signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          WORKING_DIR: ${{ matrix.working_dir }}
          COURIER_RELEASE_KEYSTORE_BASE64: ${{ secrets.COURIER_RELEASE_KEYSTORE_BASE64 }}
          COURIER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.COURIER_RELEASE_KEYSTORE_PASSWORD }}
          COURIER_RELEASE_KEY_ALIAS: ${{ secrets.COURIER_RELEASE_KEY_ALIAS }}
          COURIER_RELEASE_KEY_PASSWORD: ${{ secrets.COURIER_RELEASE_KEY_PASSWORD }}
          CUSTOMER_RELEASE_KEYSTORE_BASE64: ${{ secrets.CUSTOMER_RELEASE_KEYSTORE_BASE64 }}
          CUSTOMER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CUSTOMER_RELEASE_KEYSTORE_PASSWORD }}
          CUSTOMER_RELEASE_KEY_ALIAS: ${{ secrets.CUSTOMER_RELEASE_KEY_ALIAS }}
          CUSTOMER_RELEASE_KEY_PASSWORD: ${{ secrets.CUSTOMER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          import pathlib
          import shlex
          import sys

          configs = {
              "android-app": {
                  "label": "courier",
                  "required": True,
                  "keystore": "COURIER_RELEASE_KEYSTORE_BASE64",
                  "store_password": "COURIER_RELEASE_KEYSTORE_PASSWORD",
                  "alias": "COURIER_RELEASE_KEY_ALIAS",
                  "key_password": "COURIER_RELEASE_KEY_PASSWORD",
              },
              "android-app-customer": {
                  "label": "customer",
                  "required": True,
                  "keystore": "CUSTOMER_RELEASE_KEYSTORE_BASE64",
                  "store_password": "CUSTOMER_RELEASE_KEYSTORE_PASSWORD",
                  "alias": "CUSTOMER_RELEASE_KEY_ALIAS",
                  "key_password": "CUSTOMER_RELEASE_KEY_PASSWORD",
              },
              "android-app-merchant": {
                  "label": "merchant",
                  "required": False,
                  "keystore": "MERCHANT_RELEASE_KEYSTORE_BASE64",
                  "store_password": "MERCHANT_RELEASE_KEYSTORE_PASSWORD",
                  "alias": "MERCHANT_RELEASE_KEY_ALIAS",
                  "key_password": "MERCHANT_RELEASE_KEY_PASSWORD",
              },
          }

          working_dir = os.environ["WORKING_DIR"]
          if working_dir not in configs:
              print(f"Unknown Android app directory: {working_dir}", file=sys.stderr)
              sys.exit(1)

          config = configs[working_dir]
          secret_names = [
              config["keystore"],
              config["store_password"],
              config["alias"],
              config["key_password"],
          ]
          missing = [name for name in secret_names if not os.environ.get(name, "").strip()]
          if missing:
              if config["required"]:
                  print(f"Missing release signing secret(s): {', '.join(missing)}", file=sys.stderr)
                  sys.exit(1)
              # Optional signing (merchant): warn and continue unsigned.
              print(
                  f"::warning::Missing {config['label']} release signing secret(s): "
                  f"{', '.join(missing)}. Signed release artifacts will be skipped until secrets are set."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
                  github_output.write("has_secrets=false\n")
                  github_output.write("release_artifacts_enabled=false\n")
              sys.exit(0)

          encoded_keystore = "".join(os.environ[config["keystore"]].split())
          try:
              keystore_bytes = base64.b64decode(encoded_keystore, validate=True)
          except Exception as error:
              print(f"Invalid base64 content in {config['keystore']}: {error}", file=sys.stderr)
              sys.exit(1)

          target = pathlib.Path(working_dir) / "app" / "ci-release-keystore.jks"
          target.write_bytes(keystore_bytes)
          print(f"Wrote release keystore for {working_dir} to {target.as_posix()} ({len(keystore_bytes)} bytes)")

          env_target = pathlib.Path(working_dir) / "app" / ".ci-release-signing.env"
          env_target.write_text(
              "\n".join(
                  [
                      f"STORE_PASSWORD={shlex.quote(os.environ[config['store_password']].strip())}",
                      f"KEY_ALIAS={shlex.quote(os.environ[config['alias']].strip())}",
                      f"KEY_PASSWORD={shlex.quote(os.environ[config['key_password']].strip())}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          if not config["required"]:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
                  github_output.write("release_artifacts_enabled=true\n")
          PY

          if [[ "$(cat $GITHUB_OUTPUT | grep 'has_secrets=false')" != "" ]]; then
            exit 0
          fi

          key_path="${GITHUB_WORKSPACE}/${{ matrix.working_dir }}/app/ci-release-keystore.jks"
          signing_env="${GITHUB_WORKSPACE}/${{ matrix.working_dir }}/app/.ci-release-signing.env"
          chmod 600 "${key_path}"
          source "${signing_env}"

          if [[ "${{ matrix.working_dir }}" == "android-app" ]]; then
            keytool -list \
              -keystore "${key_path}" \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" >/dev/null || {
                echo "Invalid courier release signing secrets. Recheck COURIER_RELEASE_KEYSTORE_BASE64, COURIER_RELEASE_KEYSTORE_PASSWORD, and COURIER_RELEASE_KEY_ALIAS." >&2
                exit 1
              }

            {
              echo "RELEASE_KEYSTORE_PATH=${key_path}"
              echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          elif [[ "${{ matrix.working_dir }}" == "android-app-customer" ]]; then
            keytool -list \
              -keystore "${key_path}" \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" >/dev/null || {
                echo "Invalid customer release signing secrets. Recheck CUSTOMER_RELEASE_KEYSTORE_BASE64, CUSTOMER_RELEASE_KEYSTORE_PASSWORD, and CUSTOMER_RELEASE_KEY_ALIAS." >&2
                exit 1
              }

            {
              echo "RELEASE_KEYSTORE_PATH=${key_path}"
              echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            keytool -list \
              -keystore "${key_path}" \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" >/dev/null || {
                echo "Invalid merchant release signing secrets. Recheck MERCHANT_RELEASE_KEYSTORE_BASE64, MERCHANT_RELEASE_KEYSTORE_PASSWORD, and MERCHANT_RELEASE_KEY_ALIAS." >&2
                exit 1
              }

            {
              echo "RELEASE_KEYSTORE_PATH=${key_path}"
              echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare mobile API environment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.tembus.id/' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          base_url = os.environ.get("MOBILE_API_BASE_URL", "").strip()
          if not base_url:
              print("Missing MOBILE_API_BASE_URL repository variable for mobile builds.", file=sys.stderr)
              sys.exit(1)

          parsed = urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc:
              print("MOBILE_API_BASE_URL must be an absolute HTTPS URL, for example https://api.example.com/.", file=sys.stderr)
              sys.exit(1)

          if not base_url.endswith("/"):
              base_url = f"{base_url}/"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"BASE_URL={base_url}\n")
              github_env.write(f"DEBUG_BASE_URL={base_url}\n")
              github_env.write(f"MOBILE_API_BASE_URL={base_url}\n")

          print("Validated MOBILE_API_BASE_URL for mobile debug and release builds.")
          PY

      - name: Prepare Android Maps key
        id: android_maps_key
        if: github.event_name != 'pull_request' && matrix.needs_maps == 'true'
        shell: bash
        env:
          WORKING_DIR: ${{ matrix.working_dir }}
          TOMTOM_ANDROID_COURIER_API_KEY: ${{ secrets.TOMTOM_ANDROID_COURIER_API_KEY }}
          COURIER_TOMTOM_ANDROID_API_KEY: ${{ secrets.COURIER_TOMTOM_ANDROID_API_KEY }}
          TOMTOM_ANDROID_CUSTOMER_API_KEY: ${{ secrets.TOMTOM_ANDROID_CUSTOMER_API_KEY }}
          CUSTOMER_TOMTOM_ANDROID_API_KEY: ${{ secrets.CUSTOMER_TOMTOM_ANDROID_API_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys

          api_key_pattern = re.compile(r"^[A-Za-z0-9_-]{16,128}$")

          def write_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
                  github_output.write(f"{name}={value}\n")

          def first_value(names):
              for name in names:
                  value = os.environ.get(name, "").strip()
                  if value:
                      return name, value
              return None, ""

          configs = {
              "android-app": {
                  "label": "courier",
                  "required": ["TOMTOM_ANDROID_COURIER_API_KEY", "COURIER_TOMTOM_ANDROID_API_KEY"],
                  "exports": ["TOMTOM_ANDROID_COURIER_API_KEY", "COURIER_TOMTOM_ANDROID_API_KEY"],
              },
              "android-app-customer": {
                  "label": "customer",
                  "required": ["TOMTOM_ANDROID_CUSTOMER_API_KEY", "CUSTOMER_TOMTOM_ANDROID_API_KEY"],
                  "exports": ["TOMTOM_ANDROID_CUSTOMER_API_KEY", "CUSTOMER_TOMTOM_ANDROID_API_KEY"],
              },
          }

          working_dir = os.environ["WORKING_DIR"]
          if working_dir not in configs:
              print(f"Unknown Android app directory: {working_dir}", file=sys.stderr)
              sys.exit(1)

          courier_name, courier_key = first_value(["TOMTOM_ANDROID_COURIER_API_KEY", "COURIER_TOMTOM_ANDROID_API_KEY"])
          customer_name, customer_key = first_value(["TOMTOM_ANDROID_CUSTOMER_API_KEY", "CUSTOMER_TOMTOM_ANDROID_API_KEY"])
          shared_demo_key = bool(courier_key and customer_key and courier_key == customer_key)

          config = configs[working_dir]
          source_name, selected_key = first_value(config["required"])
          if not selected_key:
              print(
                  f"::warning::Missing {config['label']} Android Maps key secret. "
                  f"Debug CI will continue without TomTom Maps SDK rendering, and signed release artifacts will be skipped. "
                  f"Set one of: {', '.join(config['required'])}"
              )
              write_output("release_artifacts_enabled", "false")
              sys.exit(0)

          if not api_key_pattern.match(selected_key):
              print(f"{source_name} does not look like a valid TomTom Maps API key.", file=sys.stderr)
              sys.exit(1)

          print(f"::add-mask::{selected_key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              for export_name in config["exports"]:
                  github_env.write(f"{export_name}={selected_key}\n")

          if shared_demo_key:
              print(
                  "::warning::Courier and customer Android Maps secrets are identical. "
                  "Debug CI will use the demo key, but signed release artifacts are disabled until each app has a separate restricted key."
              )
              write_output("release_artifacts_enabled", "false")
          else:
              write_output("release_artifacts_enabled", "true")
          print(f"Validated {config['label']} Android Maps key secret without printing its value.")
          PY

      # 0. Pre-flight: Hilt @ApplicationContext guard
      # Catches the recurring Dagger/MissingBinding error (plain Context injection)
      # before it reaches hiltJavaCompileDebug on the CI runner.
      - name: Guard Hilt Context injection
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning for @Inject constructors injecting plain android.content.Context..."
          hits=$(grep -rEn \
            '@Inject constructor\([^)]*context: Context' \
            --include='*.kt' \
            android-app android-app-customer android-app-merchant \
            | grep -v '@ApplicationContext' \
            | grep -v '/build/' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Plain Context injection detected (must use @ApplicationContext Context):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no plain Context injection found."

      # 1. Quality Gate: Linting (fail-fast — do not ignore lint errors)
      - name: Run Lint
        run: ./gradlew lintDebug
        working-directory: ./${{ matrix.working_dir }}

      # 2. Automated Testing
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./${{ matrix.working_dir }}

      # 3. Build Artifacts with Auto-Versioning
      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --warning-mode all \
            --no-build-cache \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-staging"
        working-directory: ./${{ matrix.working_dir }}

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-build-diagnostics-${{ matrix.app_slug }}
          path: |
            ${{ matrix.working_dir }}/build/reports/problems/
            ${{ matrix.working_dir }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9

      - name: Upload Merchant debug APK (unsigned until secrets set)
        if: github.event_name != 'pull_request' && matrix.app_slug == 'merchant' && steps.prepare_signing.outputs.release_artifacts_enabled == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tembus-merchant-android-${{ github.run_number }}-debug
          path: ./android-app-merchant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Build Signed Release APK
        if: github.event_name != 'pull_request' && (steps.android_maps_key.outputs.release_artifacts_enabled == 'true' || steps.prepare_signing.outputs.release_artifacts_enabled == 'true')
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-staging"
        working-directory: ./${{ matrix.working_dir }}

      - name: Build Signed Release AAB
        if: github.event_name != 'pull_request' && (steps.android_maps_key.outputs.release_artifacts_enabled == 'true' || steps.prepare_signing.outputs.release_artifacts_enabled == 'true')
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"
        working-directory: ./${{ matrix.working_dir }}

      - name: Verify Release AAB
        if: github.event_name != 'pull_request' && (steps.android_maps_key.outputs.release_artifacts_enabled == 'true' || steps.prepare_signing.outputs.release_artifacts_enabled == 'true')
        run: |
          python scripts/mobile/verify_release_aab.py \
            --working-dir "${{ matrix.working_dir }}" \
            --app-name "${{ matrix.app_name }}" \
            --min-size-mb 1

      - name: Prepare named release assets
        if: github.event_name != 'pull_request' && (steps.android_maps_key.outputs.release_artifacts_enabled == 'true' || steps.prepare_signing.outputs.release_artifacts_enabled == 'true')
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="${{ matrix.working_dir }}/app/build/release-assets"
          debug_dir="${{ matrix.working_dir }}/app/build/outputs/apk/debug"
          release_apk_dir="${{ matrix.working_dir }}/app/build/outputs/apk/release"
          release_dir="${{ matrix.working_dir }}/app/build/outputs/bundle/release"

          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"

          debug_apk="$(find "${debug_dir}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_apk="$(find "${release_apk_dir}" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_aab="$(find "${release_dir}" -maxdepth 1 -type f -name '*.aab' -print -quit)"

          if [[ -z "${debug_apk}" ]]; then
            echo "Missing debug APK for ${{ matrix.app_name }} in ${debug_dir}" >&2
            exit 1
          fi

          if [[ -z "${release_apk}" ]]; then
            echo "Missing release APK for ${{ matrix.app_name }} in ${release_apk_dir}" >&2
            exit 1
          fi

          if [[ -z "${release_aab}" ]]; then
            echo "Missing release AAB for ${{ matrix.app_name }} in ${release_dir}" >&2
            exit 1
          fi

          cp "${debug_apk}" "${asset_dir}/${{ matrix.asset_prefix }}-debug.apk"
          cp "${release_apk}" "${asset_dir}/${{ matrix.asset_prefix }}-release.apk"
          cp "${release_aab}" "${asset_dir}/${{ matrix.asset_prefix }}-release.aab"

          ls -lh "${asset_dir}"

      - name: Upload named release assets
        if: github.event_name != 'pull_request' && (steps.android_maps_key.outputs.release_artifacts_enabled == 'true' || steps.prepare_signing.outputs.release_artifacts_enabled == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_prefix }}-android-${{ github.run_number }}
          path: ./${{ matrix.working_dir }}/app/build/release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      # 4. Enterprise Security Scan (Placeholder)
      - name: Security Check
        run: echo "🚀 Running Security Scan for ${{ matrix.app_name }}..."




      # 6. Optional: Firebase App Distribution (Requires FIREBASE_TOKEN secret)
      # - name: Upload to Firebase App Distribution
      #   uses: w9jds/firebase-action@master
      #   with:
      #     args: appdistribution:distribute ./${{ matrix.working_dir }}/app/build/outputs/apk/debug/*.apk --app ${{ matrix.app_name == 'Courier-App' && secrets.FIREBASE_APP_ID_COURIER || secrets.FIREBASE_APP_ID_CUSTOMER }}
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  create-release:
    name: Create Combined Release
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-android-*'
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }} (Courier, Customer & Merchant)"
          files: release-assets/*
          draft: false
          prerelease: true
          body: |
            Automated Staging Build for Courier, Customer and Merchant
            - Build Number: ${{ github.run_number }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: Notify Telegram (Mobile)
    needs: [build-android, create-release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "⏭️ Telegram credentials not set, skipping notification."
            exit 0
          fi

          BUILD="${{ needs.build-android.result }}"
          RELEASE="${{ needs.create-release.result }}"

          if [ "${BUILD}" == "success" ] && [ "${RELEASE}" == "success" ]; then
            STATUS="✅ *SUCCESS*"
            MESSAGE="📱 *Mobile Apps* (Courier, Customer, Merchant) berhasil di-build & di-release ke *Staging*.\n\n🔗 Release: https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}\nSHA: \`${{ github.sha }}\`"
          elif [ "${BUILD}" == "failure" ]; then
            STATUS="🚨 *BUILD FAILED*"
            MESSAGE="⚠️ Build salah satu Mobile App (Courier/Customer/Merchant) gagal di Staging.\n\nMohon periksa log di GitHub Actions.\nSHA: \`${{ github.sha }}\`"
          else
            STATUS="⚠️ *RELEASE FAILED*"
            MESSAGE="✅ Build sukses, namun GitHub Release gagal. Mohon cek logs.\nSHA: \`${{ github.sha }}\`"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${STATUS}%0A${MESSAGE}"
