name: Mobile Apps CI/CD

on:
  push:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging, production ]
  pull_request:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging ]


# Cancel in-progress runs on the same branch
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:

        include:
          - app_name: "Courier-App"
            working_dir: "android-app"
          - app_name: "Customer-App"
            working_dir: "android-app-customer"

    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./${{ matrix.working_dir }}

      - name: Prepare Firebase config
        shell: bash
        env:
          COURIER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_COURIER_GOOGLE_SERVICES_JSON_B64 }}
          CUSTOMER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_CUSTOMER_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail

          target="${{ matrix.working_dir }}/app/google-services.json"
          example="${{ matrix.working_dir }}/app/google-services.example.json"

          if [[ "${{ matrix.working_dir }}" == "android-app" && -n "${COURIER_GOOGLE_SERVICES_JSON_B64}" ]]; then
            printf '%s' "${COURIER_GOOGLE_SERVICES_JSON_B64}" | base64 -d > "${target}"
          elif [[ "${{ matrix.working_dir }}" == "android-app-customer" && -n "${CUSTOMER_GOOGLE_SERVICES_JSON_B64}" ]]; then
            printf '%s' "${CUSTOMER_GOOGLE_SERVICES_JSON_B64}" | base64 -d > "${target}"
          elif [[ -f "${example}" ]]; then
            cp "${example}" "${target}"
          else
            echo "Missing Firebase config and example template for ${{ matrix.working_dir }}" >&2
            exit 1
          fi

          chmod 600 "${target}"

      # 1. Quality Gate: Linting
      - name: Run Lint
        run: ./gradlew lintDebug
        working-directory: ./${{ matrix.working_dir }}
        continue-on-error: true

      # 2. Automated Testing
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./${{ matrix.working_dir }}

      # 3. Build Artifacts with Auto-Versioning
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-staging"
        working-directory: ./${{ matrix.working_dir }}

      # 4. Enterprise Security Scan (Placeholder)
      - name: Security Check
        run: echo "🚀 Running Security Scan for ${{ matrix.app_name }}..."

      # 5. Create GitHub Release & Upload APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }} - ${{ matrix.app_name }}"
          files: ./${{ matrix.working_dir }}/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
          body: |
            Automated Staging Build for ${{ matrix.app_name }}
            - Build Number: ${{ github.run_number }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # 6. Optional: Firebase App Distribution (Requires FIREBASE_TOKEN secret)
      # - name: Upload to Firebase App Distribution
      #   uses: w9jds/firebase-action@master
      #   with:
      #     args: appdistribution:distribute ./${{ matrix.working_dir }}/app/build/outputs/apk/debug/*.apk --app ${{ matrix.app_name == 'Courier-App' && secrets.FIREBASE_APP_ID_COURIER || secrets.FIREBASE_APP_ID_CUSTOMER }}
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
