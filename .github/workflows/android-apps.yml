name: Mobile Apps CI/CD

on:
  push:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging, production ]
  pull_request:
    paths:
      - 'android-app/**'
      - 'android-app-customer/**'
      - '.github/workflows/android-apps.yml'
    branches: [ staging ]


# Cancel in-progress runs on the same branch
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:

        include:
          - app_name: "Courier-App"
            working_dir: "android-app"
          - app_name: "Customer-App"
            working_dir: "android-app-customer"

    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./${{ matrix.working_dir }}

      - name: Prepare Firebase config
        shell: bash
        env:
          WORKING_DIR: ${{ matrix.working_dir }}
          COURIER_GOOGLE_SERVICES_JSON: ${{ secrets.COURIER_GOOGLE_SERVICES_JSON }}
          CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys

          configs = {
              "android-app": (
                  "COURIER_GOOGLE_SERVICES_JSON",
                  "com.lancar.courier",
              ),
              "android-app-customer": (
                  "CUSTOMER_GOOGLE_SERVICES_JSON",
                  "com.lancar.customer",
              ),
          }

          working_dir = os.environ["WORKING_DIR"]
          if working_dir not in configs:
              print(f"Unknown Android app directory: {working_dir}", file=sys.stderr)
              sys.exit(1)

          secret_name, expected_package = configs[working_dir]
          raw_secret = os.environ.get(secret_name, "").strip()
          if not raw_secret:
              print(f"Missing {secret_name} repository secret", file=sys.stderr)
              sys.exit(1)

          def load_google_services(value: str) -> dict:
              try:
                  return json.loads(value)
              except json.JSONDecodeError as raw_error:
                  try:
                      decoded = base64.b64decode(value, validate=True).decode("utf-8-sig").strip()
                      return json.loads(decoded)
                  except Exception:
                      print(
                          f"Invalid {secret_name}. Paste the full google-services.json content "
                          "as raw JSON, or store a base64-encoded JSON value.",
                          file=sys.stderr,
                      )
                      raise raw_error

          data = load_google_services(raw_secret)
          clients = data.get("client") or []
          actual_package = (
              clients[0]
              .get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              if clients
              else None
          )
          if actual_package != expected_package:
              print(
                  f"Firebase config package mismatch. Expected {expected_package}, got {actual_package}",
                  file=sys.stderr,
              )
              sys.exit(1)

          target = pathlib.Path(working_dir) / "app" / "google-services.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Wrote Firebase config for {actual_package} to {target}")
          PY

          chmod 600 "${{ matrix.working_dir }}/app/google-services.json"

      - name: Prepare release signing
        if: github.event_name == 'push'
        shell: bash
        env:
          WORKING_DIR: ${{ matrix.working_dir }}
          COURIER_RELEASE_KEYSTORE_BASE64: ${{ secrets.COURIER_RELEASE_KEYSTORE_BASE64 }}
          COURIER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.COURIER_RELEASE_KEYSTORE_PASSWORD }}
          COURIER_RELEASE_KEY_ALIAS: ${{ secrets.COURIER_RELEASE_KEY_ALIAS }}
          COURIER_RELEASE_KEY_PASSWORD: ${{ secrets.COURIER_RELEASE_KEY_PASSWORD }}
          CUSTOMER_RELEASE_KEYSTORE_BASE64: ${{ secrets.CUSTOMER_RELEASE_KEYSTORE_BASE64 }}
          CUSTOMER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CUSTOMER_RELEASE_KEYSTORE_PASSWORD }}
          CUSTOMER_RELEASE_KEY_ALIAS: ${{ secrets.CUSTOMER_RELEASE_KEY_ALIAS }}
          CUSTOMER_RELEASE_KEY_PASSWORD: ${{ secrets.CUSTOMER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          configs = {
              "android-app": {
                  "keystore": "COURIER_RELEASE_KEYSTORE_BASE64",
                  "store_password": "COURIER_RELEASE_KEYSTORE_PASSWORD",
                  "alias": "COURIER_RELEASE_KEY_ALIAS",
                  "key_password": "COURIER_RELEASE_KEY_PASSWORD",
              },
              "android-app-customer": {
                  "keystore": "CUSTOMER_RELEASE_KEYSTORE_BASE64",
                  "store_password": "CUSTOMER_RELEASE_KEYSTORE_PASSWORD",
                  "alias": "CUSTOMER_RELEASE_KEY_ALIAS",
                  "key_password": "CUSTOMER_RELEASE_KEY_PASSWORD",
              },
          }

          working_dir = os.environ["WORKING_DIR"]
          if working_dir not in configs:
              print(f"Unknown Android app directory: {working_dir}", file=sys.stderr)
              sys.exit(1)

          config = configs[working_dir]
          missing = [name for name in config.values() if not os.environ.get(name, "").strip()]
          if missing:
              print(f"Missing release signing secret(s): {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          keystore_bytes = base64.b64decode(os.environ[config["keystore"]].strip(), validate=True)
          target = pathlib.Path(working_dir) / "app" / "ci-release-keystore.jks"
          target.write_bytes(keystore_bytes)
          print(target.as_posix())
          PY

          key_path="${GITHUB_WORKSPACE}/${{ matrix.working_dir }}/app/ci-release-keystore.jks"
          chmod 600 "${key_path}"

          if [[ "${{ matrix.working_dir }}" == "android-app" ]]; then
            keytool -list \
              -keystore "${key_path}" \
              -storepass "${COURIER_RELEASE_KEYSTORE_PASSWORD}" \
              -alias "${COURIER_RELEASE_KEY_ALIAS}" >/dev/null

            {
              echo "RELEASE_KEYSTORE_PATH=${key_path}"
              echo "RELEASE_KEYSTORE_PASSWORD=${COURIER_RELEASE_KEYSTORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${COURIER_RELEASE_KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${COURIER_RELEASE_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            keytool -list \
              -keystore "${key_path}" \
              -storepass "${CUSTOMER_RELEASE_KEYSTORE_PASSWORD}" \
              -alias "${CUSTOMER_RELEASE_KEY_ALIAS}" >/dev/null

            {
              echo "RELEASE_KEYSTORE_PATH=${key_path}"
              echo "RELEASE_KEYSTORE_PASSWORD=${CUSTOMER_RELEASE_KEYSTORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${CUSTOMER_RELEASE_KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${CUSTOMER_RELEASE_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          fi

      # 1. Quality Gate: Linting
      - name: Run Lint
        run: ./gradlew lintDebug
        working-directory: ./${{ matrix.working_dir }}
        continue-on-error: true

      # 2. Automated Testing
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./${{ matrix.working_dir }}

      # 3. Build Artifacts with Auto-Versioning
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-staging"
        working-directory: ./${{ matrix.working_dir }}

      - name: Build Signed Release AAB
        if: github.event_name == 'push'
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"
        working-directory: ./${{ matrix.working_dir }}
        env:
          BASE_URL: ${{ vars.MOBILE_API_BASE_URL || vars.STAGING_API_BASE_URL || vars.STAGING_URL || 'https://api.lancar.id/' }}

      - name: Upload Release AAB artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}-release-aab-${{ github.run_number }}
          path: ./${{ matrix.working_dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # 4. Enterprise Security Scan (Placeholder)
      - name: Security Check
        run: echo "🚀 Running Security Scan for ${{ matrix.app_name }}..."

      # 5. Create GitHub Release & Upload APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }} - ${{ matrix.app_name }}"
          files: |
            ./${{ matrix.working_dir }}/app/build/outputs/apk/debug/*.apk
            ./${{ matrix.working_dir }}/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: true
          body: |
            Automated Staging Build for ${{ matrix.app_name }}
            - Build Number: ${{ github.run_number }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # 6. Optional: Firebase App Distribution (Requires FIREBASE_TOKEN secret)
      # - name: Upload to Firebase App Distribution
      #   uses: w9jds/firebase-action@master
      #   with:
      #     args: appdistribution:distribute ./${{ matrix.working_dir }}/app/build/outputs/apk/debug/*.apk --app ${{ matrix.app_name == 'Courier-App' && secrets.FIREBASE_APP_ID_COURIER || secrets.FIREBASE_APP_ID_CUSTOMER }}
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
