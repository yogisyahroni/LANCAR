name: Wire roadside service adjustment once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/wire-service-adjustment-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Wire service and routes safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/order-service/cmd/api/main.go')
          s = p.read_text()
          old_service = '''\tserviceReportSvc := service.NewServiceReportService(serviceReportRepo)\n\ttowingClaimRepo := repository.NewTowingDamageClaimRepository(db)'''
          new_service = '''\tserviceReportSvc := service.NewServiceReportService(serviceReportRepo)\n\tserviceAdjustmentRepo := repository.NewServiceAdjustmentRepository(db)\n\tserviceAdjustmentSvc := service.NewServiceAdjustmentService(serviceAdjustmentRepo)\n\tserviceAdjustmentHandler := handler.NewServiceAdjustmentHandler(serviceAdjustmentSvc)\n\ttowingClaimRepo := repository.NewTowingDamageClaimRepository(db)'''
          if old_service not in s:
              raise SystemExit('service wiring anchor not found')
          s = s.replace(old_service, new_service, 1)
          old_route = '''\tmux.HandleFunc("/api/v1/courier/service-report/tambal-ban", middleware.BaseChain(middleware.AuthMiddleware(tambalBanHandler.CreateTambalBanReport)))\n\tmux.HandleFunc("/api/v1/courier/service-report/towing", middleware.BaseChain(middleware.AuthMiddleware(towingHandler.CreateTowingReport)))'''
          new_route = '''\tmux.HandleFunc("/api/v1/courier/service-report/tambal-ban", middleware.BaseChain(middleware.AuthMiddleware(tambalBanHandler.CreateTambalBanReport)))\n\t// TIRE-2026-003: structured on-site adjustment. Proposal/decision are protected twice:\n\t// shared HTTP idempotency plus domain-level idempotency persisted with the adjustment transaction.\n\tmux.HandleFunc("/api/v1/courier/service-adjustments", middleware.BaseChain(middleware.AuthMiddleware(middleware.RequireIdempotencyKey(writeDB, "service_adjustment.propose", serviceAdjustmentHandler.Propose))))\n\tmux.HandleFunc("/api/v1/customer/service-adjustments", middleware.BaseChain(middleware.AuthMiddleware(serviceAdjustmentHandler.ListForOrder)))\n\tmux.HandleFunc("/api/v1/customer/service-adjustments/decision", middleware.BaseChain(middleware.AuthMiddleware(middleware.RequireIdempotencyKey(writeDB, "service_adjustment.decision", serviceAdjustmentHandler.Decide))))\n\tmux.HandleFunc("/api/v1/courier/service-report/towing", middleware.BaseChain(middleware.AuthMiddleware(towingHandler.CreateTowingReport)))'''
          if old_route not in s:
              raise SystemExit('route wiring anchor not found')
          p.write_text(s.replace(old_route, new_route, 1))
      - name: Format and commit wiring
        run: |
          cd backend/order-service && gofmt -w cmd/api/main.go
          cd ../..
          git rm .github/workflows/wire-service-adjustment-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/order-service/cmd/api/main.go
          git commit -m "feat: wire roadside service adjustment endpoints"
          git push origin staging
