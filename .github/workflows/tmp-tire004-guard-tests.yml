name: Verify TIRE-2026-004 guard tests once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/tmp-tire004-guard-tests.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/order-service/go.mod
          cache-dependency-path: backend/order-service/go.sum
      - name: Run focused report guard tests
        working-directory: backend/order-service
        run: go test ./internal/repository -run '^TestCreateTambalBanReport' -count=1
      - name: Remove one-shot workflow
        if: always()
        run: rm -f .github/workflows/tmp-tire004-guard-tests.yml
      - name: Commit cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove TIRE-2026-004 guard test workflow'
          git push origin HEAD:staging
