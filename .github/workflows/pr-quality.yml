name: PR Quality Gates

on:
  pull_request:
    branches: [development, staging, main]

# Ephemeral GitHub Actions service database only; these values are scoped to CI
# test containers and are not production or staging runtime credentials.
env:
  CI_POSTGRES_USER: tembus_ci
  CI_POSTGRES_PASSWORD: tembus_ci_ephemeral_db_auth
  CI_POSTGRES_DB: tembus_ci

jobs:
  security-quality:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────
  # FRONTEND QUALITY
  # ───────────────────────────────────────────────
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: https://ci-api.tembus.invalid/api/v1
          NEXT_PUBLIC_WS_URL: wss://ci-api.tembus.invalid
          NEXT_PUBLIC_SOCKET_URL: https://ci-api.tembus.invalid
          SERVER_API_URL: https://ci-api.tembus.invalid/api/v1

  # ───────────────────────────────────────────────
  # ADMIN SERVICE (NODE.JS)
  # ───────────────────────────────────────────────
  admin-quality:
    name: Admin Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: mirror.gcr.io/redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json
      - name: Install & Test
        working-directory: ./backend/admin-service
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  # AUTH SERVICE (GO)
  # ───────────────────────────────────────────────
  auth-quality:
    name: Auth Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: mirror.gcr.io/redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/auth-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go vet ./...
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  # ROUTING SERVICE (GO)
  # ───────────────────────────────────────────────
  routing-quality:
    name: Routing Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: mirror.gcr.io/redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/routing-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go vet ./...
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  observability-quality:
    name: Observability Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static observability leak guard
        run: node scripts/ci/observability-guard.mjs

      - name: Validate OpenTelemetry Collector config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro" \
            otel/opentelemetry-collector-contrib:0.128.0 \
            validate --config=/etc/otelcol/config.yml

      - name: Docker Compose observability config check
        run: docker compose config --quiet
