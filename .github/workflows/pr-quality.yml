name: PR Quality Gates

on:
  pull_request:
    branches: [development, staging, main]

jobs:
  # ───────────────────────────────────────────────
  # FRONTEND QUALITY
  # ───────────────────────────────────────────────
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  # ───────────────────────────────────────────────
  # ADMIN SERVICE (NODE.JS)
  # ───────────────────────────────────────────────
  admin-quality:
    name: Admin Service Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json
      - name: Install & Test
        working-directory: ./backend/admin-service
        run: |
          npm ci
          npx tsc --noEmit
          npm test
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"

  # ───────────────────────────────────────────────
  # AUTH SERVICE (GO)
  # ───────────────────────────────────────────────
  auth-quality:
    name: Auth Service Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/auth-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go vet ./...
          go test -v ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"

  # ───────────────────────────────────────────────
  # ROUTING SERVICE (GO)
  # ───────────────────────────────────────────────
  routing-quality:
    name: Routing Service Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/routing-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go vet ./...
          go test -v ./...
        env:
          DB_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
