name: PR Quality Gates

on:
  pull_request:
    branches: [development, staging, main]

jobs:
  security-quality:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────
  # FRONTEND QUALITY
  # ───────────────────────────────────────────────
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ───────────────────────────────────────────────
  # ADMIN SERVICE (NODE.JS)
  # ───────────────────────────────────────────────
  admin-quality:
    name: Admin Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json
      - name: Install & Test
        working-directory: ./backend/admin-service
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  # AUTH SERVICE (GO)
  # ───────────────────────────────────────────────
  auth-quality:
    name: Auth Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/auth-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go vet ./...
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  # ROUTING SERVICE (GO)
  # ───────────────────────────────────────────────
  routing-quality:
    name: Routing Service Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/routing-service/go.sum
      - name: Lint & Test
        working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go vet ./...
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
