name: CI/CD Production

on:
  push:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────
  # FULL QUALITY & BUILD
  # ───────────────────────────────────────────────
  
  build-and-test:
    name: Build & Test All
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      
      # Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      
      # Admin Service
      - run: cd backend/admin-service && npm ci && npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          
      # Go Services
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: |
          cd backend/auth-service && go mod tidy && go test -v -timeout 5m ./...
          cd ../routing-service && go mod tidy && go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          DB_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  security:
    name: Critical Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Production Deps
        run: |
          cd frontend && npm audit --audit-level=high
          cd ../backend/admin-service && npm audit --audit-level=high

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Placeholder
        run: echo "🚀 Deploying to Production Server..."

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/auth-service:latest
            ghcr.io/${{ github.repository }}/auth-service:${{ github.sha }}

      - name: Build and Push Routing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routing-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/routing-service:latest
            ghcr.io/${{ github.repository }}/routing-service:${{ github.sha }}

      - name: Build and Push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/admin-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/admin-service:latest
            ghcr.io/${{ github.repository }}/admin-service:${{ github.sha }}
