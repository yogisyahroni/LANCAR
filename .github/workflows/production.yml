name: CI/CD Production

on:
  push:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────
  # FULL QUALITY & BUILD
  # ───────────────────────────────────────────────
  
  build-and-test:
    name: Build & Test All
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
    steps:
      - uses: actions/checkout@v4
      
      # Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      
      # Admin Service
      - run: cd backend/admin-service && npm ci && npm test
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          
      # Go Services
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: |
          cd backend/auth-service && go mod tidy && go test ./...
          cd ../routing-service && go mod tidy && go test ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          DB_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"

  security:
    name: Critical Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Production Deps
        run: |
          cd frontend && npm audit --audit-level=high
          cd ../backend/admin-service && npm audit --audit-level=high

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Placeholder
        run: echo "🚀 Deploying to Production Server..."
