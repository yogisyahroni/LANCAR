name: CI/CD Production

on:
  push:
    branches: [main]

# Ephemeral GitHub Actions service database only; production runtime database
# credentials must come from protected environment secrets on the server.
env:
  CI_POSTGRES_USER: tembus_ci
  CI_POSTGRES_PASSWORD: tembus_ci_ephemeral_db_auth
  CI_POSTGRES_DB: tembus_ci

jobs:
  # ───────────────────────────────────────────────
  # FULL QUALITY & BUILD
  # ───────────────────────────────────────────────
  
  build-and-test:
    name: Build & Test All
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: mirror.gcr.io/redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      
      # Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
          SERVER_API_URL: ${{ vars.SERVER_API_URL || vars.NEXT_PUBLIC_API_URL }}
      
      # Admin Service
      - run: cd backend/admin-service && npm ci && npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          
      # Go Services
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - run: |
          cd backend/auth-service && go mod tidy && go test -v -timeout 5m ./...
          cd ../routing-service && go mod tidy && go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          DB_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  security:
    name: Critical Security Audit
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Production Deps
        run: |
          cd frontend && npm audit --audit-level=high
          cd ../backend/admin-service && npm audit --audit-level=high

  container-security:
    name: Container SBOM & Secret Audit (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: ./backend/auth-service
          - image: routing-service
            context: ./backend/routing-service
          - image: admin-service
            context: ./backend/admin-service
          - image: order-service
            context: ./backend/order-service
          - image: payment-service
            context: ./backend/payment-service
          - image: api-gateway
            context: ./backend/api-gateway
          - image: frontend
            context: ./frontend
          - image: admin-dashboard
            context: ./admin-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for audit
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          pull: true
          push: false
          load: true
          tags: tembus-local/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: tembus-local/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json

      - name: Scan image for secrets, vulnerabilities, and config risks
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: tembus-local/${{ matrix.image }}:${{ github.sha }}
          scanners: secret,vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Placeholder
        run: echo "🚀 Deploying to Production Server..."

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [container-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          pull: true
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:latest
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:${{ github.sha }}

      - name: Build and Push Routing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routing-service
          pull: true
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:latest
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:${{ github.sha }}

      - name: Build and Push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/admin-service
          pull: true
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:latest
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:${{ github.sha }}
