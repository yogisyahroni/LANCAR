name: CI/CD Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: backend/routing-service/go.sum

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/admin-service/package-lock.json

    - name: Test Routing Service (Go)
      working-directory: ./backend/routing-service
      run: |
        go mod tidy
        go test -v ./...
      env:
        DB_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
        REDIS_URL: "localhost:6379"

    - name: Test Admin Service (Node.js)
      working-directory: ./backend/admin-service
      run: |
        npm ci
        npm test
      env:
        DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
        REDIS_HOST: "localhost"
        REDIS_PORT: 6379

