name: Testing Ops (Scheduled)

# Testing yang Boleh di CI tetapi butuh jadwal/kondisi khusus:
# - Performance, Compatibility, Accessibility, Visual → schedule (cron)
# - Smoke → post-deploy push main
# - E2E → push main (subset)

on:
  schedule:
    # Setiap Senin 02:00 WIB (19:00 UTC) — performance/compat/accessibility/visual
    - cron: '0 19 * * 1'
  workflow_dispatch:

concurrency:
  group: testing-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # PERFORMANCE — k6 (jadwal, bukan blocker PR)
  # ─────────────────────────────────────────────
  performance-load:
    name: Performance (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: k6 smoke-load on staging
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/ci/k6/smoke-test.js
          flags: --vus 20 --duration 60s
        env:
          K6_BASE_URL: https://api.bawain.my.id
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # ─────────────────────────────────────────────
  # COMPATIBILITY — Playwright matrix (gratis; pengganti BrowserStack)
  # Cross-browser web: chromium, firefox, webkit di OS runner.
  # ─────────────────────────────────────────────
  compatibility-browsers:
    name: Compatibility (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        browser: [chromium, firefox, webkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: |
          npm ci --prefix frontend
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-browser smoke
        run: npm run test:e2e:compat -- --grep "@compat"
        env:
          BASE_URL: https://app.bawain.my.id

  # ─────────────────────────────────────────────
  # ACCESSIBILITY — axe-core + Lighthouse CI
  # ─────────────────────────────────────────────
  accessibility:
    name: Accessibility (axe/Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse CI accessibility
        run: |
          npm ci --prefix frontend
          npx lhci autorun --config=scripts/ci/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # VISUAL — Percy (jadwal; screenshot diff)
  # ─────────────────────────────────────────────
  visual-regression:
    name: Visual Regression (Percy)
    runs-on: ubuntu-latest
    if: ${{ secrets.PERCY_TOKEN != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Percy snapshot
        run: |
          npm ci --prefix frontend
          npx percy exec --config scripts/ci/percy.yml -- npm run build
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

  # ─────────────────────────────────────────────
  # E2E SUBSET — smoke alur kritis (push main)
  # ─────────────────────────────────────────────
  e2e-smoke-critical:
    name: E2E Critical Paths (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright critical E2E
        run: |
          npm ci --prefix frontend
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "@critical"
        env:
          BASE_URL: https://app.bawain.my.id