name: Testing Ops (Scheduled)

# Testing yang Boleh di CI tetapi butuh jadwal/kondisi khusus:
# - Performance, Compatibility, Accessibility, Visual → schedule (cron)
# - Smoke → post-deploy push main
# - E2E → push main (subset)

on:
  schedule:
    # Setiap Senin 02:00 WIB (19:00 UTC) — performance/compat/accessibility/visual
    - cron: '0 19 * * 1'
  workflow_dispatch:

concurrency:
  group: testing-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # PRE-FLIGHT — cek ketersediaan staging (tunnel)
  # Kalau cloudflared/tunnel mati, semua job di-skip (bukan gagal palsu).
  # ─────────────────────────────────────────────
  preflight:
    name: Preflight Staging Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api_ok: ${{ steps.check.outputs.api_ok }}
      web_ok: ${{ steps.check.outputs.web_ok }}
    steps:
      - name: Cek API + Web reachable
        id: check
        run: |
          set +e
          http_code_api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://api.bawain.my.id/health 2>/dev/null)
          http_code_web=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://app.bawain.my.id/login 2>/dev/null)
          echo "api_http=$http_code_api"
          echo "web_http=$http_code_web"
          if [ "$http_code_api" != "000" ] && [ "$http_code_web" != "000" ]; then
            echo "✅ Staging reachable (api=$http_code_api, web=$http_code_web)"
            echo "api_ok=true" >> $GITHUB_OUTPUT
            echo "web_ok=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Tunnel/Staging tidak reachable (api=$http_code_api, web=$http_code_web)"
            echo "   Job akan di-skip otomatis. Nyalakan tunnel lalu jalankan ulang."
            echo "api_ok=false" >> $GITHUB_OUTPUT
            echo "web_ok=false" >> $GITHUB_OUTPUT
          fi
  # ─────────────────────────────────────────────
  # PERFORMANCE — k6 (jadwal, bukan blocker PR)
  # ─────────────────────────────────────────────
  performance-load:
    name: Performance (k6)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.api_ok == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: k6 smoke-load on staging
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/ci/k6/smoke-test.js
          flags: --vus 20 --duration 60s
        env:
          K6_BASE_URL: https://api.bawain.my.id
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # ─────────────────────────────────────────────
  # COMPATIBILITY — Playwright matrix (gratis; pengganti BrowserStack)
  # Cross-browser web: chromium, firefox, webkit di OS runner.
  # ─────────────────────────────────────────────
  compatibility-browsers:
    name: Compatibility (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    if: needs.preflight.outputs.web_ok == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        browser: [chromium, firefox, webkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: |
          npm ci --prefix frontend
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-browser smoke
        run: npm run test:e2e:compat -- --grep "@compat"
        env:
          BASE_URL: https://app.bawain.my.id

  # ─────────────────────────────────────────────
  # ACCESSIBILITY — axe-core + Lighthouse CI
  # ─────────────────────────────────────────────
  accessibility:
    name: Accessibility (axe/Lighthouse) (non-blocking)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.web_ok == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse CI accessibility
        run: |
          npm ci --prefix frontend
          npx lhci autorun --config=scripts/ci/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_TOKEN }}
      - name: axe-core scan against staging (non-blocking)
        continue-on-error: true
        run: |
          npx --yes @axe-core/cli https://app.bawain.my.id https://app.bawain.my.id/login \
            --tags wcag2a,wcag2aa,wcag21aa,wcag22aa,best-practice \
            --exit

  # ─────────────────────────────────────────────
  # VISUAL — Percy (jadwal; screenshot diff)
  # ─────────────────────────────────────────────
  visual-regression:
    name: Visual Regression (Percy)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.web_ok == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Percy snapshot
        run: |
          npm ci --prefix frontend
          npx percy exec --config scripts/ci/percy.yml -- npm run build
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

  # ─────────────────────────────────────────────
  # E2E SUBSET — smoke alur kritis (push main)
  # ─────────────────────────────────────────────
  e2e-smoke-critical:
    name: E2E Critical Paths (Playwright)
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.web_ok == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright critical E2E
        run: |
          npm ci --prefix frontend
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "@critical"
        env:
          BASE_URL: https://app.bawain.my.id