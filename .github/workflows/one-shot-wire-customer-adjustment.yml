name: One-shot wire customer adjustment

on:
  push:
    paths:
      - '.github/workflows/one-shot-wire-customer-adjustment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Wire customer adjustment API and repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('android-app-customer/app/src/main/java/com/tembus/customer/data/api/TEMBUSApiService.kt')
          text = api.read_text()
          if 'suspend fun getServiceAdjustments(' not in text:
              marker = '    // A4: global banner (pengumuman in-app platform-wide).\n'
              assert marker in text, 'customer API insertion marker missing'
              block = '''    // TIRE-2026-003: customer explicitly reviews/decides on-site price adjustments.\n    @GET("api/v1/customer/service-adjustments")\n    suspend fun getServiceAdjustments(\n        @Query("order_id") orderId: String\n    ): Response<ServiceAdjustmentListResponse>\n\n    @POST("api/v1/customer/service-adjustments/decision")\n    suspend fun decideServiceAdjustment(\n        @Header("X-Idempotency-Key") idempotencyKey: String,\n        @Body request: ServiceAdjustmentDecisionRequest\n    ): Response<ServiceAdjustment>\n\n'''
              text = text.replace(marker, block + marker, 1)
              api.write_text(text)

          repo = Path('android-app-customer/app/src/main/java/com/tembus/customer/data/repository/OrderRepository.kt')
          text = repo.read_text()
          if 'suspend fun getServiceAdjustments(' not in text:
              marker = '        // ============================================================\n        // FOOD-BIKE-070: Favorite Merchants (C3)\n'
              assert marker in text, 'customer repository insertion marker missing'
              block = '''        // ============================================================\n        // TIRE-2026-003: roadside on-site adjustment consent\n        // ============================================================\n\n        suspend fun getServiceAdjustments(orderId: String): Result<List<ServiceAdjustment>> {\n            return try {\n                val response = apiService.getServiceAdjustments(orderId)\n                val body = response.body()\n                if (response.isSuccessful && body != null) {\n                    Result.success(body.adjustments)\n                } else {\n                    Result.failure(Exception(response.readErrorMessage("Penyesuaian harga belum dapat dimuat")))\n                }\n            } catch (e: Exception) {\n                Result.failure(e)\n            }\n        }\n\n        suspend fun decideServiceAdjustment(\n            adjustmentId: String,\n            decision: String,\n            rejectionReason: String? = null\n        ): Result<ServiceAdjustment> {\n            return try {\n                val normalizedDecision = decision.trim().lowercase()\n                val response = apiService.decideServiceAdjustment(\n                    idempotencyKey = "customer-adjustment-$adjustmentId-$normalizedDecision",\n                    request = ServiceAdjustmentDecisionRequest(\n                        adjustmentId = adjustmentId,\n                        decision = normalizedDecision,\n                        rejectionReason = rejectionReason?.trim()?.takeIf { it.isNotEmpty() }\n                    )\n                )\n                val body = response.body()\n                if (response.isSuccessful && body != null) {\n                    Result.success(body)\n                } else {\n                    Result.failure(Exception(response.readErrorMessage("Keputusan penyesuaian harga gagal diproses")))\n                }\n            } catch (e: Exception) {\n                Result.failure(e)\n            }\n        }\n\n'''
              text = text.replace(marker, block + marker, 1)
              repo.write_text(text)
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-wire-customer-adjustment.yml
          git add android-app-customer/app/src/main/java/com/tembus/customer/data/api/TEMBUSApiService.kt \
                  android-app-customer/app/src/main/java/com/tembus/customer/data/repository/OrderRepository.kt
          git commit -m 'fix: wire customer roadside adjustment consent'
          git push origin HEAD:staging
