name: One-time TIRE003 idempotency patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/one-time-tire003-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch deterministic service-adjustment key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android-app/app/src/main/java/com/tembus/courier/data/repository/OrderRepository.kt')
          text = path.read_text()

          old_call = 'idempotencyKey = idempotencyKey("service-adjustment", orderId),'
          new_call = 'idempotencyKey = serviceAdjustmentIdempotencyKey(orderId, reason, items),'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('service-adjustment idempotency call not found')

          if 'private fun serviceAdjustmentIdempotencyKey(' not in text:
              match = re.search(r'(?m)^\s*private fun idempotencyKey\(scope: String, discriminator: String\): String \{', text)
              if not match:
                  raise SystemExit('generic idempotency helper not found')
              helper = '''    private fun serviceAdjustmentIdempotencyKey(
              orderId: String,
              reason: String,
              items: List<ServiceAdjustmentItem>
          ): String {
              val canonical = buildString {
                  append(orderId.trim())
                  append('|')
                  append(reason.trim())
                  items.forEach { item ->
                      append('|')
                      append(item.code.trim())
                      append(':')
                      append(item.label.trim())
                      append(':')
                      append(item.type.trim().lowercase())
                      append(':')
                      append(item.quantity)
                      append(':')
                      append(item.unitPriceIdr)
                  }
              }
              return "courier-service-adjustment-${UUID.nameUUIDFromBytes(canonical.toByteArray(Charsets.UTF_8))}"
          }

          '''
              text = text[:match.start()] + helper + text[match.start():]

          path.write_text(text)
          PY
          rm -f .github/workflows/one-time-tire003-idempotency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make roadside adjustment retries idempotent"
          git push origin HEAD:staging
