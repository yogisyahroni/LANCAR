name: One-time TIRE003 idempotency patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/one-time-tire003-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch deterministic service-adjustment key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android-app/app/src/main/java/com/tembus/courier/data/repository/OrderRepository.kt')
          text = path.read_text()

          old_call = 'idempotencyKey = idempotencyKey("service-adjustment", orderId),'
          new_call = 'idempotencyKey = serviceAdjustmentIdempotencyKey(orderId, reason, items),'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one service-adjustment idempotency call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call)

          anchor = '''    private fun idempotencyKey(scope: String, discriminator: String): String {
              return "courier-$scope-$discriminator-${UUID.randomUUID()}"
          }
          '''
          helper = '''    private fun serviceAdjustmentIdempotencyKey(
              orderId: String,
              reason: String,
              items: List<ServiceAdjustmentItem>
          ): String {
              val canonical = buildString {
                  append(orderId.trim())
                  append('|')
                  append(reason.trim())
                  items.forEach { item ->
                      append('|')
                      append(item.code)
                      append(':')
                      append(item.label)
                      append(':')
                      append(item.type)
                      append(':')
                      append(item.quantity)
                      append(':')
                      append(item.unitPriceIdr)
                  }
              }
              return "courier-service-adjustment-${UUID.nameUUIDFromBytes(canonical.toByteArray(Charsets.UTF_8))}"
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one idempotency helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor)
          path.write_text(text)
          PY
          rm -f .github/workflows/one-time-tire003-idempotency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make roadside adjustment retries idempotent"
          git push origin HEAD:staging
