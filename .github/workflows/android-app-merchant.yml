name: Merchant App CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app-merchant/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-app-merchant.yml'
    branches: [ staging, production ]
  pull_request:
    paths:
      - 'android-app-merchant/**'
      - 'scripts/mobile/**'
      - '.github/workflows/android-app-merchant.yml'
    branches: [ staging ]

concurrency:
  group: merchant-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-merchant:
    name: Build Merchant App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Guard against Google Maps SDK residue
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'google_maps|GOOGLE_MAPS|maps\.googleapis\.com|routes\.googleapis\.com|GoogleMapCanvas|play-services-maps|com\.google\.maps\.android|com\.google\.android\.gms\.maps|google\.navigation' \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            android-app-merchant scripts/mobile; then
            echo "Google Maps runtime or SDK residue detected. Merchant app must not depend on Google Maps SDK." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android-app-merchant

      - name: Prepare mobile API environment
        shell: bash
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.tembus.id/' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          base_url = os.environ.get("MOBILE_API_BASE_URL", "").strip()
          if not base_url:
              print("Missing MOBILE_API_BASE_URL repository variable for merchant builds.", file=sys.stderr)
              sys.exit(1)

          parsed = urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc:
              print("MOBILE_API_BASE_URL must be an absolute HTTPS URL.", file=sys.stderr)
              sys.exit(1)

          if not base_url.endswith("/"):
              base_url = f"{base_url}/"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"BASE_URL={base_url}\n")
              github_env.write(f"DEBUG_BASE_URL={base_url}\n")
              github_env.write(f"MOBILE_API_BASE_URL={base_url}\n")
          print("Validated MOBILE_API_BASE_URL for merchant debug builds.")
          PY

      - name: Run Lint
        run: ./gradlew lintDebug
        working-directory: ./android-app-merchant
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./android-app-merchant

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --warning-mode all \
            --no-build-cache \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}-staging"
        working-directory: ./android-app-merchant

      - name: Upload Merchant debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tembus-merchant-debug-${{ github.run_number }}
          path: ./android-app-merchant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
