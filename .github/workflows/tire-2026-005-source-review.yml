name: TIRE-2026-005 source review
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/tire-2026-005-source-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/order-service/go.mod
          cache: false
      - name: Package offline verification toolchain
        working-directory: backend/order-service
        run: |
          go mod download
          mkdir -p /tmp/tire005-tools
          tar -czf /tmp/tire005-tools/go-sdk.tar.gz -C /opt/hostedtoolcache/go "$(go version | awk '{print $3}' | sed 's/^go//')"/x64
          tar -czf /tmp/tire005-tools/go-modules.tar.gz -C "$(go env GOPATH)" pkg/mod
          go version > /tmp/tire005-tools/version.txt
          sha256sum /tmp/tire005-tools/*.tar.gz > /tmp/tire005-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tire-2026-005-offline-tools
          path: /tmp/tire005-tools/
          retention-days: 1
