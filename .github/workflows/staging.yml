name: CI/CD Staging

on:
  push:
    branches: [staging]

jobs:
  # ───────────────────────────────────────────────
  # BUILD & TEST ALL SERVICES
  # ───────────────────────────────────────────────
  
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: ./frontend
        run: |
          npm ci
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  admin-service:
    name: Admin Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json
      - working-directory: ./backend/admin-service
        run: |
          npm ci
          npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  auth-service:
    name: Auth Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/auth-service/go.sum
      - working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  routing-service:
    name: Routing Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
      redis:
        image: redis:6-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/routing-service/go.sum
      - working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go test -v -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  # SECURITY & DEPLOY
  # ───────────────────────────────────────────────
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, admin-service, auth-service, routing-service]
    steps:
      - uses: actions/checkout@v4
      - name: Audit Node.js Services
        run: |
          cd frontend && npm audit --audit-level=high || true
          cd ../backend/admin-service && npm audit --audit-level=high || true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Placeholder
        run: echo "🚀 Deploying to Staging Server..."

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [frontend, admin-service, auth-service, routing-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/auth-service:staging
            ghcr.io/${{ github.repository }}/auth-service:staging-${{ github.sha }}

      - name: Build and Push Routing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routing-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/routing-service:staging
            ghcr.io/${{ github.repository }}/routing-service:staging-${{ github.sha }}

      - name: Build and Push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/admin-service
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/admin-service:staging
            ghcr.io/${{ github.repository }}/admin-service:staging-${{ github.sha }}
