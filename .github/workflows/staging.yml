name: CI/CD Staging

on:
  push:
    branches: [staging, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [staging]

# Cancel in-progress runs on the same branch (save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # PHASE 1: BUILD & TEST (parallel)
  # ═══════════════════════════════════════════════════════════

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ───────────────────────────────────────────────
  admin-service:
    name: Admin Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json

      - name: Install dependencies
        working-directory: ./backend/admin-service
        run: npm ci

      - name: Run tests
        working-directory: ./backend/admin-service
        run: npm test -- --testTimeout=60000
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NODE_ENV: test

  # ───────────────────────────────────────────────
  auth-service:
    name: Auth Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/auth-service/go.sum

      - name: Verify modules are tidy
        working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go mod verify

      - name: Run tests
        working-directory: ./backend/auth-service
        run: go test -v -race -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  routing-service:
    name: Routing Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: backend/routing-service/go.sum

      - name: Verify modules are tidy
        working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go mod verify

      - name: Run tests
        working-directory: ./backend/routing-service
        run: go test -v -race -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/lancar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  # ───────────────────────────────────────────────
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: lancar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run migrations UP
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=postgres password=1234 dbname=lancar sslmode=disable" \
            up

      - name: Verify migration version
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=postgres password=1234 dbname=lancar sslmode=disable" \
            version

      - name: Run migrations DOWN (rollback test)
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=postgres password=1234 dbname=lancar sslmode=disable" \
            down

  # ═══════════════════════════════════════════════════════════
  # PHASE 2: SECURITY SCANS (needs all tests to pass)
  # ═══════════════════════════════════════════════════════════

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, admin-service, auth-service, routing-service, migration-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks

      # ── Node.js dependency audit ──────────────────────────
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: |
          npm ci --quiet
          npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit (admin-service)
        working-directory: ./backend/admin-service
        run: |
          npm ci --quiet
          npm audit --audit-level=high
        continue-on-error: true

      # ── Go vulnerability check ───────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: govulncheck (auth-service)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend/auth-service && govulncheck ./...
        continue-on-error: true

      - name: govulncheck (routing-service)
        run: |
          cd backend/routing-service && govulncheck ./...
        continue-on-error: true

      # ── Go static security analysis ───────────────────────
      - name: gosec (auth-service)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd backend/auth-service && gosec -severity high -confidence high ./... 2>&1 || true

      - name: gosec (routing-service)
        run: |
          cd backend/routing-service && gosec -severity high -confidence high ./... 2>&1 || true

      # ── Secret scanning ───────────────────────────────────
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  # PHASE 3: DOCKER BUILD & PUSH
  # ═══════════════════════════════════════════════════════════

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security]
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:staging-${{ github.sha }}

      - name: Build and Push Routing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routing-service
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:staging-${{ github.sha }}

      - name: Build and Push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/admin-service
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:staging-${{ github.sha }}

      # ── Trivy: scan pushed images for vulnerabilities ─────
      - name: Trivy scan (auth-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/auth-service:staging-${{ github.sha }}
          format: table
          exit-code: '0'          # 0 = report only, 1 = fail on CRITICAL
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan (admin-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/admin-service:staging-${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ═══════════════════════════════════════════════════════════
  # PHASE 4: DEPLOY TO STAGING
  # ═══════════════════════════════════════════════════════════

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Placeholder
        run: |
          echo "🚀 Deploying to Staging Server..."
          echo "  Auth:    ghcr.io/${GITHUB_REPOSITORY,,}/auth-service:staging-${GITHUB_SHA}"
          echo "  Admin:   ghcr.io/${GITHUB_REPOSITORY,,}/admin-service:staging-${GITHUB_SHA}"
          echo "  Routing: ghcr.io/${GITHUB_REPOSITORY,,}/routing-service:staging-${GITHUB_SHA}"
          echo ""
          echo "⏳ When server is ready: replace this with SSH deploy or docker-compose pull + up"

  e2e-browser-validation:
    name: E2E Browser Validation
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E against Staging
        working-directory: ./frontend
        run: npx playwright test
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Test Results to PR
        if: failure()
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ❌ **E2E Test Failed** atau terdeteksi console error di browser.
            Lihat report: [Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
