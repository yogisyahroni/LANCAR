name: CI/CD Staging

on:
  workflow_dispatch:
  push:
    branches: [staging, "chore/**", "feat/**", "fix/**", "hotfix/**", "recovery/**", "agent/**"]

# Ordinary TASK-ID development is PR-less. Worker branches run the full
# pre-integration verification path; only the staging ref may publish/deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_POSTGRES_USER: tembus_ci
  CI_POSTGRES_PASSWORD: tembus_ci_ephemeral_db_auth
  CI_POSTGRES_DB: tembus_ci
  STAGING_FRONTEND_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tembus.id/api/v1' }}
  STAGING_FRONTEND_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://api.tembus.id' }}
  STAGING_FRONTEND_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL || 'https://api.tembus.id' }}
  STAGING_SERVER_API_URL: ${{ vars.SERVER_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.tembus.id/api/v1' }}
  STAGING_ADMIN_API_URL: ${{ vars.VITE_API_URL || 'https://api.tembus.id/api/v1' }}
  STAGING_ADMIN_WS_URL: ${{ vars.VITE_WS_URL || 'wss://api.tembus.id' }}
  STAGING_ADMIN_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://api.tembus.id' }}

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint
      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test
      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: ${{ env.STAGING_FRONTEND_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ env.STAGING_FRONTEND_WS_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ env.STAGING_FRONTEND_SOCKET_URL }}
          SERVER_API_URL: ${{ env.STAGING_SERVER_API_URL }}

  maps-runtime-guard:
    name: Maps Runtime Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on Google Maps runtime residue
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'google_maps|GOOGLE_MAPS|GOOGLE_ROUTES|GOOGLE_DIRECTIONS|maps\.googleapis\.com|routes\.googleapis\.com|GoogleMapCanvas|play-services-maps|com\.google\.maps\.android|com\.google\.android\.gms\.maps|google\.navigation' \
            --exclude-dir=node_modules --exclude-dir=build --exclude-dir=dist --exclude-dir=.gradle \
            backend admin-dashboard frontend android-app android-app-customer docker-compose.yml docker-compose.prod.yml .env.example; then
            echo "Google Maps runtime residue detected. Firebase google-services and Play Services Location are allowed; Google Maps is not." >&2
            exit 1
          fi

  customer-location-privacy-guard:
    name: Customer Location Privacy Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify customer app never starts GPS at boot
        shell: bash
        run: |
          set -euo pipefail
          manifest='android-app-customer/app/src/main/AndroidManifest.xml'
          boot_receiver='android-app-customer/app/src/main/java/com/tembus/customer/receiver/BootReceiver.kt'
          location_service='android-app-customer/app/src/main/java/com/tembus/customer/service/LocationTrackerService.kt'

          if grep -n 'ACCESS_BACKGROUND_LOCATION' "$manifest"; then
            echo 'Customer app must not request background location.' >&2
            exit 1
          fi
          if [[ -e "$location_service" ]]; then
            echo 'Unused customer location tracking service must not exist.' >&2
            exit 1
          fi
          if grep -nE 'LocationServices|FusedLocation|startService|startForegroundService' "$boot_receiver"; then
            echo 'BootReceiver must never start location tracking.' >&2
            exit 1
          fi
          grep -q 'BOOT_COMPLETED' "$manifest"
          grep -q 'CustomerResyncWorker.enqueue' "$boot_receiver"

  admin-service:
    name: Admin Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/admin-service/package-lock.json
      - name: Install dependencies
        working-directory: ./backend/admin-service
        run: npm ci
      - name: Typecheck
        working-directory: ./backend/admin-service
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: ./backend/admin-service
        run: npm test -- --testTimeout=60000 --coverage=false
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NODE_ENV: test

  auth-service:
    name: Auth Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/auth-service/go.sum
      - name: Verify modules are tidy
        working-directory: ./backend/auth-service
        run: |
          go mod tidy
          go mod verify
      - name: Run golangci-lint
        working-directory: backend/auth-service
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --timeout=5m
      - name: Run tests
        working-directory: ./backend/auth-service
        run: go test -v -race -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  routing-service:
    name: Routing Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: mirror.gcr.io/redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/routing-service/go.sum
      - name: Verify modules are tidy
        working-directory: ./backend/routing-service
        run: |
          go mod tidy
          go mod verify
      - name: Run golangci-lint
        working-directory: backend/routing-service
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./... --timeout=5m
      - name: Run tests
        working-directory: ./backend/routing-service
        run: go test -v -race -timeout 5m ./...
        env:
          DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Run migrations UP
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=${CI_POSTGRES_USER} password=${CI_POSTGRES_PASSWORD} dbname=${CI_POSTGRES_DB} sslmode=disable" up
      - name: Verify migration version
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=${CI_POSTGRES_USER} password=${CI_POSTGRES_PASSWORD} dbname=${CI_POSTGRES_DB} sslmode=disable" version
      - name: Run migrations DOWN (rollback test)
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=${CI_POSTGRES_USER} password=${CI_POSTGRES_PASSWORD} dbname=${CI_POSTGRES_DB} sslmode=disable" down

  food-inventory-concurrency:
    name: Food Inventory Concurrency Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/order-service/go.sum
      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run migrations UP
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=${CI_POSTGRES_USER} password=${CI_POSTGRES_PASSWORD} dbname=${CI_POSTGRES_DB} sslmode=disable" up
      - name: Run migration-backed oversell test
        working-directory: ./backend/order-service
        run: go test -v -race -timeout 5m ./internal/repository -run TestFoodInventoryReservationPreventsConcurrentOversell -count=1
        env:
          TEMBUS_ORDER_SERVICE_TEST_DATABASE_URL: "postgresql://${{ env.CI_POSTGRES_USER }}:${{ env.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ env.CI_POSTGRES_DB }}?sslmode=disable"
      - name: Roll back test database
        if: always()
        run: |
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=${CI_POSTGRES_USER} password=${CI_POSTGRES_PASSWORD} dbname=${CI_POSTGRES_DB} sslmode=disable" down

  observability-guard:
    name: Observability Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, maps-runtime-guard, customer-location-privacy-guard, admin-service, auth-service, routing-service, migration-test, food-inventory-concurrency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static observability leak guard
        run: node scripts/ci/observability-guard.mjs
      - name: Validate OpenTelemetry Collector config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro" \
            otel/opentelemetry-collector-contrib:0.128.0 \
            validate --config=/etc/otelcol/config.yml
      - name: Docker Compose observability config check
        run: GRAFANA_ADMIN_PASSWORD=ci-only-observability-password docker compose config --quiet

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [observability-guard]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: |
          npm ci --quiet
          npm audit --audit-level=high
      - name: npm audit (admin-service)
        working-directory: ./backend/admin-service
        run: |
          npm ci --quiet
          npm audit --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Show Go version
        run: go version
      - name: govulncheck (auth-service)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend/auth-service
          go mod tidy
          govulncheck ./...
      - name: govulncheck (routing-service)
        run: |
          cd backend/routing-service
          go mod tidy
          govulncheck ./...
      - name: gosec (auth-service)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd backend/auth-service
          gosec -severity high -confidence high ./...
      - name: gosec (routing-service)
        run: |
          cd backend/routing-service
          gosec -severity high -confidence high ./...
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  container-security:
    name: Container SBOM & Secret Audit (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: auth-service, context: ./backend/auth-service }
          - { image: routing-service, context: ./backend/routing-service }
          - { image: admin-service, context: ./backend/admin-service }
          - { image: order-service, context: ./backend/order-service }
          - { image: datalake-worker, context: ./backend/datalake-worker }
          - { image: payment-service, context: ./backend/payment-service }
          - { image: api-gateway, context: ./backend/api-gateway }
          - { image: frontend, context: ./frontend }
          - { image: admin-dashboard, context: ./admin-dashboard }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build local image for audit
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          pull: true
          push: false
          load: true
          tags: tembus-local/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.STAGING_FRONTEND_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.STAGING_FRONTEND_WS_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.STAGING_FRONTEND_SOCKET_URL }}
            VITE_API_URL=${{ env.STAGING_ADMIN_API_URL }}
            VITE_WS_URL=${{ env.STAGING_ADMIN_WS_URL }}
            VITE_SOCKET_URL=${{ env.STAGING_ADMIN_SOCKET_URL }}
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: tembus-local/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
      - name: Scan image for secrets, vulnerabilities, and config risks
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: tembus-local/${{ matrix.image }}:${{ github.sha }}
          scanners: secret,vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [container-security]
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Lowercase repo name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          pull: true
          push: true
          cache-from: type=gha,scope=auth-v2
          cache-to: type=gha,mode=max,scope=auth-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/auth-service:staging-${{ github.sha }}
      - name: Build and Push Routing Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/routing-service
          pull: true
          push: true
          cache-from: type=gha,scope=routing-v2
          cache-to: type=gha,mode=max,scope=routing-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/routing-service:staging-${{ github.sha }}
      - name: Build and Push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/admin-service
          pull: true
          push: true
          cache-from: type=gha,scope=admin-v2
          cache-to: type=gha,mode=max,scope=admin-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/admin-service:staging-${{ github.sha }}
      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/order-service
          pull: true
          push: true
          cache-from: type=gha,scope=order-v2
          cache-to: type=gha,mode=max,scope=order-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/order-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/order-service:staging-${{ github.sha }}
      - name: Build and Push Datalake Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend/datalake-worker
          pull: true
          push: true
          cache-from: type=gha,scope=datalake-v2
          cache-to: type=gha,mode=max,scope=datalake-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/datalake-worker:staging
            ghcr.io/${{ env.REPO_LOWER }}/datalake-worker:staging-${{ github.sha }}
      - name: Build and Push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          pull: true
          push: true
          cache-from: type=gha,scope=payment-v2
          cache-to: type=gha,mode=max,scope=payment-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/payment-service:staging
            ghcr.io/${{ env.REPO_LOWER }}/payment-service:staging-${{ github.sha }}
      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          pull: true
          push: true
          cache-from: type=gha,scope=gateway-v2
          cache-to: type=gha,mode=max,scope=gateway-v2
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api-gateway:staging
            ghcr.io/${{ env.REPO_LOWER }}/api-gateway:staging-${{ github.sha }}
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          pull: true
          push: true
          cache-from: type=gha,scope=frontend-v2
          cache-to: type=gha,mode=max,scope=frontend-v2
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.STAGING_FRONTEND_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.STAGING_FRONTEND_WS_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.STAGING_FRONTEND_SOCKET_URL }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:staging
            ghcr.io/${{ env.REPO_LOWER }}/frontend:staging-${{ github.sha }}
      - name: Build and Push Admin Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          pull: true
          push: true
          cache-from: type=gha,scope=dashboard-v2
          cache-to: type=gha,mode=max,scope=dashboard-v2
          build-args: |
            VITE_API_URL=${{ env.STAGING_ADMIN_API_URL }}
            VITE_WS_URL=${{ env.STAGING_ADMIN_WS_URL }}
            VITE_SOCKET_URL=${{ env.STAGING_ADMIN_SOCKET_URL }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/admin-dashboard:staging
            ghcr.io/${{ env.REPO_LOWER }}/admin-dashboard:staging-${{ github.sha }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    outputs:
      deployed: ${{ steps.deploy_ssh.outputs.deployed || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.STAGING_SSH_HOST }}" ]; then
            echo "⚠️ STAGING_SSH_HOST belum di-set. Deploy di-skip; release validation tetap pending."
            echo "has_ssh=false" >> $GITHUB_OUTPUT
          else
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          fi
      - name: Write SSH private key
        if: steps.check_secrets.outputs.has_ssh == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.STAGING_SSH_PORT || '22' }} ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy via SSH
        id: deploy_ssh
        if: steps.check_secrets.outputs.has_ssh == 'true'
        env:
          REPO_LOWER: ${{ github.repository }}
          SHA: staging-${{ github.sha }}
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR || '/opt/lancar-staging' }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER || 'root' }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_LOWER_LC="${REPO_LOWER,,}"
          ssh -i ~/.ssh/id_rsa -p "${STAGING_SSH_PORT}" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" bash -s << EOF
          set -euo pipefail
          cd "${STAGING_APP_DIR}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${REPO_LOWER_LC}/auth-service:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/routing-service:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/admin-service:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/order-service:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/datalake-worker:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/payment-service:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/api-gateway:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/frontend:${SHA}
          docker pull ghcr.io/${REPO_LOWER_LC}/admin-dashboard:${SHA}
          docker-compose up -d traefik
          export CURRENT_SHA="${SHA}"
          export REPO="${REPO_LOWER_LC}"
          for svc in auth-service routing-service admin-service order-service datalake-worker payment-service api-gateway frontend admin-dashboard; do
            OLD_CONTAINER=\$(docker-compose ps -q \${svc} | head -n 1 || true)
            docker-compose up -d --no-deps --scale \${svc}=2 --no-recreate \${svc} || true
            sleep 30
            NEW_CONTAINER=\$(docker-compose ps -q \${svc} | grep -v "^\${OLD_CONTAINER}\$" | head -n 1 || true)
            if [ -n "\${NEW_CONTAINER}" ]; then
              IS_HEALTHY=\$(docker inspect --format='{{json .State.Health.Status}}' \${NEW_CONTAINER} 2>/dev/null || echo '"healthy"')
              if [ "\${IS_HEALTHY}" == '"unhealthy"' ]; then
                docker stop \${NEW_CONTAINER} || true
                docker rm \${NEW_CONTAINER} || true
                docker-compose up -d --no-deps --scale \${svc}=1 --no-recreate \${svc} || true
                exit 1
              fi
            fi
            if [ -n "\${OLD_CONTAINER}" ]; then
              docker stop \${OLD_CONTAINER} || true
              docker rm \${OLD_CONTAINER} || true
            fi
            docker-compose up -d --no-deps --scale \${svc}=1 --no-recreate \${svc} || true
          done
          sleep 5
          curl -sf http://localhost:8080/health
          docker image prune -f --filter "until=24h" || true
          EOF
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  release-validation-pending:
    name: Release Validation Pending
    needs: [deploy]
    if: github.ref == 'refs/heads/staging' && needs.deploy.result == 'success' && needs.deploy.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record pending external validation
        run: |
          echo "### Release validation pending" >> "$GITHUB_STEP_SUMMARY"
          echo "The commit passed repository verification and container publication, but no staging SSH deployment occurred." >> "$GITHUB_STEP_SUMMARY"
          echo "External staging E2E/API validation is intentionally deferred until staging deployment is configured." >> "$GITHUB_STEP_SUMMARY"

  regression-api:
    name: API Regression (k6)
    needs: [deploy]
    # Always execute the external gate after the deploy job. Missing staging
    # configuration must fail the gate explicitly, never silently skip it.
    if: github.ref == 'refs/heads/staging' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require API regression credentials
        run: |
          if [ -z "${{ secrets.TEST_USER_EMAIL }}" ] || [ -z "${{ secrets.TEST_USER_PASSWORD }}" ]; then
            echo "TEST_USER_EMAIL and TEST_USER_PASSWORD are required for API Regression (k6)." >&2
            exit 1
          fi
      - name: Run k6 API regression
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/ci/k6/smoke-test.js
          flags: --vus 1 --duration 10s
        env:
          K6_BASE_URL: ${{ env.STAGING_SERVER_API_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          K6_DEVICE_ID: "gha-regression-20260820"

  e2e-browser-validation:
    name: E2E Browser Validation
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Always execute the external gate after the deploy job. Missing staging
    # configuration must fail the gate explicitly, never silently skip it.
    if: github.ref == 'refs/heads/staging' && needs.deploy.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Require browser validation configuration
        run: |
          if [ -z "${{ vars.STAGING_URL }}" ]; then
            echo "STAGING_URL is required for E2E Browser Validation." >&2
            exit 1
          fi
          if [ -z "${{ secrets.TEST_USER_EMAIL }}" ] || [ -z "${{ secrets.TEST_USER_PASSWORD }}" ]; then
            echo "TEST_USER_EMAIL and TEST_USER_PASSWORD are required for E2E Browser Validation." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E against Staging URL
        working-directory: ./frontend
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  notify:
    name: Notification
    needs: [deploy, release-validation-pending, e2e-browser-validation, regression-api]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/staging'
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            exit 0
          fi
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            STATUS="🚨 *FAILED*"
            MESSAGE="⚠️ Deploy ke Staging gagal. SHA: \`${{ github.sha }}\`"
          elif [ "${{ needs.e2e-browser-validation.result }}" != "success" ] || [ "${{ needs.regression-api.result }}" != "success" ]; then
            STATUS="🚨 *VALIDATION FAILED*"
            MESSAGE="External E2E/API validation gagal atau konfigurasinya belum tersedia. SHA: \`${{ github.sha }}\`"
          elif [ "${{ needs.deploy.outputs.deployed }}" != "true" ]; then
            STATUS="🟡 *VALIDATION PENDING*"
            MESSAGE="Repository verification lulus, tetapi staging belum dideploy karena environment deployment belum tersedia. SHA: \`${{ github.sha }}\`"
          else
            STATUS="✅ *SUCCESS*"
            MESSAGE="🚀 Update terbaru telah di-deploy dan divalidasi di *Staging*. SHA: \`${{ github.sha }}\`"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="*LANCAR Staging Deployment* - ${STATUS}%0A%0A${MESSAGE}" \
            -d parse_mode="Markdown"
