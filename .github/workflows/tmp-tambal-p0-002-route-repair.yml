name: TAMBAL-P0-002 service tracking route repair

on:
  push:
    branches:
      - fix/TAMBAL-P0-002-service-tracking-route
    paths:
      - .github/workflows/tmp-tambal-p0-002-route-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/TAMBAL-P0-002-service-tracking-route
          fetch-depth: 0

      - name: Patch route and regression contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/tambal_p0_002.py
          python3 /tmp/tambal_p0_002.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run targeted customer route test
        working-directory: android-app-customer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.tembus.customer.ui.screens.service.ServiceRouteContractTest'

      - name: Commit repaired route and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tambal-p0-002-route-repair.yml
          git add android-app-customer/app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt
          git add android-app-customer/app/src/test/java/com/tembus/customer/ui/screens/service/ServiceRouteContractTest.kt
          git commit -m 'fix(customer): register roadside service tracking route'
          git push origin HEAD:fix/TAMBAL-P0-002-service-tracking-route
