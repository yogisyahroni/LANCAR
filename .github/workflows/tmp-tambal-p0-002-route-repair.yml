name: TAMBAL-P0-002 service tracking route repair

on:
  push:
    branches:
      - fix/TAMBAL-P0-002-service-tracking-route
    paths:
      - .github/workflows/tmp-tambal-p0-002-route-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/TAMBAL-P0-002-service-tracking-route
          fetch-depth: 0

      - name: Register roadside tracking destination and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          nav = Path('android-app-customer/app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt')
          source = nav.read_text(encoding='utf-8')

          registration = '''            composable(
                route = Screen.ServiceTracking.route,
                arguments = listOf(
                    navArgument("orderId") { type = NavType.StringType },
                    navArgument("serviceSubType") { type = NavType.StringType }
                )
            ) { backStackEntry ->
                val orderId = backStackEntry.arguments?.getString("orderId").orEmpty()
                val serviceSubType = backStackEntry.arguments?.getString("serviceSubType") ?: "tambal_ban_motor"
                ServiceTrackingScreen(
                    orderId = orderId,
                    serviceSubType = serviceSubType,
                    onBackClick = { navController.popBackStack() },
                    onChatClick = { id -> navController.navigate(Screen.Chat.createRoute(id, null)) },
                    onCallClick = { id -> navController.navigate(Screen.InAppCall.createRoute(id, null, "outgoing")) }
                )
            }

'''

          if 'route = Screen.ServiceTracking.route' not in source:
              anchor = '            composable(Screen.Notifications.route) {'
              if anchor not in source:
                  raise SystemExit('RootNavGraph insertion anchor missing')
              source = source.replace(anchor, registration + anchor, 1)
              nav.write_text(source, encoding='utf-8')

          test = Path('android-app-customer/app/src/test/java/com/tembus/customer/ui/screens/service/ServiceRouteContractTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.tembus.customer.ui.screens.service

import com.tembus.customer.ui.navigation.Screen
import java.io.File
import org.junit.Assert.assertEquals
import org.junit.Assert.assertTrue
import org.junit.Test

class ServiceRouteContractTest {
    @Test
    fun serviceTrackingRouteCarriesOrderAndCanonicalServiceSubtype() {
        assertEquals(
            "service-tracking/order-123/tambal_ban_motor",
            Screen.ServiceTracking.createRoute("order-123", "tambal_ban_motor")
        )
    }

    @Test
    fun rootNavGraphRegistersServiceTrackingDestination() {
        val source = File(
            "app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt"
        ).readText()

        assertTrue(source.contains("route = Screen.ServiceTracking.route"))
        assertTrue(source.contains("navArgument(\\\"orderId\\\")"))
        assertTrue(source.contains("navArgument(\\\"serviceSubType\\\")"))
        assertTrue(source.contains("ServiceTrackingScreen("))
    }
}
''', encoding='utf-8')
          PY

      - name: Verify route contract statically
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'route = Screen.ServiceTracking.route' android-app-customer/app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt
          grep -F 'ServiceTrackingScreen(' android-app-customer/app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt
          grep -F 'service-tracking/order-123/tambal_ban_motor' android-app-customer/app/src/test/java/com/tembus/customer/ui/screens/service/ServiceRouteContractTest.kt

      - name: Commit repaired route and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tambal-p0-002-route-repair.yml
          git add android-app-customer/app/src/main/java/com/tembus/customer/ui/navigation/RootNavGraph.kt
          git add android-app-customer/app/src/test/java/com/tembus/customer/ui/screens/service/ServiceRouteContractTest.kt
          git commit -m 'fix(customer): register roadside service tracking route'
          git push origin HEAD:fix/TAMBAL-P0-002-service-tracking-route
