name: CI/CD Development

on:
  push:
    branches: [development]

jobs:
  dev-check:
    name: Quick Dev Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      
      # Minimal checks for speed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production Mock Guard
        run: node scripts/ci/check-production-mocks.js
      - name: Frontend Build Check
        run: cd frontend && npm install --prefer-offline && npm run build
        
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Backend Build Check
        run: |
          cd backend/auth-service && go build ./...
          cd ../routing-service && go build ./...
          
      - name: Deploy to Dev Staging
        run: echo "🚀 Deploying to Development Server..."
