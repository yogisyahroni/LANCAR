name: Wire TIRE-2026-003 mobile consent flow

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/tmp-tire003-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch roadside adjustment device flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend: proposals are only valid once the technician is actually on site / inspecting / working.
          repo = 'backend/order-service/internal/repository/service_adjustment_repository.go'
          replace_once(repo,
              'var customerID, category, serviceCode, serviceSubType, quoteID, pricingSnapshot string\n\tvar originalTotal int64',
              'var customerID, category, serviceCode, serviceSubType, quoteID, pricingSnapshot, orderStatus string\n\tvar originalTotal int64')
          replace_once(repo,
              "COALESCE(o.quote_id::text, ''), COALESCE(o.pricing_snapshot::text, '{}'), o.total_price_idr",
              "COALESCE(o.quote_id::text, ''), COALESCE(o.pricing_snapshot::text, '{}'), o.status, o.total_price_idr")
          replace_once(repo,
              'Scan(&customerID, &category, &serviceCode, &serviceSubType, &quoteID, &pricingSnapshot, &originalTotal)',
              'Scan(&customerID, &category, &serviceCode, &serviceSubType, &quoteID, &pricingSnapshot, &orderStatus, &originalTotal)')
          replace_once(repo,
              '\tif category != "tambal_ban" && category != "towing" {\n\t\treturn nil, fmt.Errorf("%w: adjustment hanya untuk roadside service", domain.ErrInvalidServiceAdjustment)\n\t}\n',
              '\tif category != "tambal_ban" && category != "towing" {\n\t\treturn nil, fmt.Errorf("%w: adjustment hanya untuk roadside service", domain.ErrInvalidServiceAdjustment)\n\t}\n\tswitch strings.ToLower(strings.TrimSpace(orderStatus)) {\n\tcase "arrived", "verifying", "in_progress", "service_complete":\n\tdefault:\n\t\treturn nil, fmt.Errorf("%w: adjustment hanya dapat diajukan setelah teknisi tiba dan saat inspeksi/pengerjaan", domain.ErrServiceAdjustmentConflict)\n\t}\n')

