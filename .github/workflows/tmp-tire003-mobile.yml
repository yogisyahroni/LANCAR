          Path('android-app/app/src/main/java/com/tembus/courier/ui/screens/service/ServiceAdjustmentProposalCard.kt').write_text(r'''package com.tembus.courier.ui.screens.service

import androidx.compose.foundation.BorderStroke
import androidx.compose.foundation.layout.Arrangement
import androidx.compose.foundation.layout.Column
