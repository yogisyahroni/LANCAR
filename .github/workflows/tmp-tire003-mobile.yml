          Path('android-app/app/src/main/java/com/tembus/courier/data/repository/ServiceAdjustmentRepository.kt').write_text(r'''package com.tembus.courier.data.repository

import com.tembus.courier.data.api.TEMBUSApiService
import com.tembus.courier.data.model.ProposeServiceAdjustmentRequest
import com.tembus.courier.data.model.ServiceAdjustment
import com.tembus.courier.data.model.ServiceAdjustmentItem
import javax.inject.Inject
import javax.inject.Singleton

@Singleton
class ServiceAdjustmentRepository @Inject constructor(
    private val apiService: TEMBUSApiService
) {
    suspend fun propose(
        orderId: String,
        reason: String,
        items: List<ServiceAdjustmentItem>,
        idempotencyKey: String
    ): Result<ServiceAdjustment> = try {
        val response = apiService.proposeServiceAdjustment(
            idempotencyKey,
            ProposeServiceAdjustmentRequest(orderId, reason, items)
        )
        val body = response.body()
        if (response.isSuccessful && body != null) Result.success(body)
        else Result.failure(IllegalStateException("Penyesuaian harga gagal diajukan (${response.code()})"))
    } catch (e: Exception) {
        Result.failure(e)
    }
}
''')

          Path('android-app/app/src/main/java/com/tembus/courier/ui/screens/service/OnSiteAdjustmentViewModel.kt').write_text(r'''package com.tembus.courier.ui.screens.service

import androidx.lifecycle.ViewModel
import androidx.lifecycle.viewModelScope
import com.tembus.courier.data.model.ServiceAdjustment
import com.tembus.courier.data.model.ServiceAdjustmentItem
import com.tembus.courier.data.repository.ServiceAdjustmentRepository
import dagger.hilt.android.lifecycle.HiltViewModel
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.launch
import javax.inject.Inject

data class OnSiteAdjustmentUiState(
    val isLoading: Boolean = false,
    val submitted: ServiceAdjustment? = null,
    val error: String? = null
)

@HiltViewModel
class OnSiteAdjustmentViewModel @Inject constructor(
    private val repository: ServiceAdjustmentRepository
) : ViewModel() {
    private val _uiState = MutableStateFlow(OnSiteAdjustmentUiState())
    val uiState: StateFlow<OnSiteAdjustmentUiState> = _uiState.asStateFlow()

    fun submit(
        orderId: String,
        reason: String,
        materialLabel: String,
        materialPriceText: String,
        laborLabel: String,
        laborPriceText: String
    ) {
        val cleanReason = reason.trim()
        val materialPrice = materialPriceText.filter(Char::isDigit).toLongOrNull() ?: 0L
        val laborPrice = laborPriceText.filter(Char::isDigit).toLongOrNull() ?: 0L
        if (cleanReason.length !in 5..500) {
            _uiState.value = OnSiteAdjustmentUiState(error = "Alasan harus 5-500 karakter")
            return
        }
        val items = buildList {
            if (materialPrice > 0) add(ServiceAdjustmentItem("MATERIAL_CUSTOM", materialLabel.trim().ifBlank { "Material tambahan" }, "material", 1, materialPrice))
            if (laborPrice > 0) add(ServiceAdjustmentItem("LABOR_EXTRA", laborLabel.trim().ifBlank { "Jasa tambahan" }, "labor", 1, laborPrice))
        }
        if (items.isEmpty()) {
            _uiState.value = OnSiteAdjustmentUiState(error = "Isi minimal satu biaya material atau jasa")
            return
        }
        val fingerprint = "$orderId|$cleanReason|${items.joinToString { "${it.code}:${it.label}:${it.unitPriceIdr}" }}"
        val key = "courier-adjustment-$orderId-${fingerprint.hashCode()}"
        viewModelScope.launch {
            _uiState.value = OnSiteAdjustmentUiState(isLoading = true)
            repository.propose(orderId, cleanReason, items, key)
                .onSuccess { _uiState.value = OnSiteAdjustmentUiState(submitted = it) }
                .onFailure { _uiState.value = OnSiteAdjustmentUiState(error = it.localizedMessage ?: "Gagal mengajukan penyesuaian") }
        }
    }
}
''')

