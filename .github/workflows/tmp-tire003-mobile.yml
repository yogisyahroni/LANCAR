name: Temporary TIRE-2026-003 Mobile Wiring

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/tmp-tire003-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Apply mobile adjustment patch
        run: python3 .github/scripts/tmp_tire003_mobile_patch.py
      - name: Commit source and remove temporary tooling
        run: |
          rm -f .github/workflows/tmp-tire003-mobile.yml
          rm -f .github/scripts/tmp_tire003_mobile_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete roadside adjustment mobile consent flow'
          git push origin staging
