name: One-time marketplace checklist sync

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/checklist-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Update completed checklist items
        shell: python
        run: |
          from pathlib import Path

          path = Path('task-food-marketplace-parity-2026.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- [ ] Offline reconnect uses snapshot.': '- [x] Offline reconnect uses snapshot. (VERIFIED 2026-09-06: Android tracking reconciles authoritative order/tracking REST snapshots on polling, refresh, and realtime events.)',
              '- [ ] Address change requotes.': '- [x] Address change requotes. (IMPLEMENTED 2026-09-06: saved/geocoded/GPS destination changes invalidate the old Food quote and automatically request a fresh server-authoritative quote after a prior quote intent.)',
              '- [ ] Validate merchant/item/variant/stock/voucher/radius/tax/fee/schedule.': '- [x] Validate merchant/item/variant/stock/voucher/radius/tax/fee/schedule. (VERIFIED 2026-09-06 in `food_quote_service.go`: server validates merchant state, item ownership/availability/inventory, variants, voucher, delivery radius, tax/fees, and schedule before persisting the quote.)',
              '- [ ] No unjustified boot background tracking.': '- [x] No unjustified boot background tracking. (VERIFIED 2026-09-06: `BootReceiver` only schedules authenticated session resync; it does not start location tracking.)',
              '- [ ] Location change refreshes technician/quote. (GAP — onPinCorrect hanya memperbaiki lokasi; tidak auto-refresh technician/quote setelah correction)': '- [x] Location change refreshes technician/quote. (IMPLEMENTED 2026-09-06: corrected pickup invalidates the old quote, refreshes nearby eligible technicians, and requests a fresh server-authoritative quote; stale preferred selection is invalidated.)',
              '- [ ] Preferred technician revalidated on create. (GAP — belum ada preferred technician assignment)': '- [x] Preferred technician revalidated on create. (IMPLEMENTED 2026-09-06: Android refreshes candidate eligibility; admin-service revalidates approval, online/fresh location, capability/vehicle, zone/radius and workload before pricing/order persistence; dispatch-time guard remains as race protection.)',
              '- [ ] Provider circuit-open/unavailable not selectable.': '- [x] Provider circuit-open/unavailable not selectable. (VERIFIED 2026-09-06: Integration Gateway registry exposes runtime availability, handlers reject unavailable providers, and Aggregator Web disables unavailable provider options.)',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit checklist update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add task-food-marketplace-parity-2026.md
          git diff --cached --check
          git commit -m 'docs: mark verified marketplace checklist items complete'
          git push origin HEAD:staging
