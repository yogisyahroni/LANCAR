name: Auto-Merge PR ke Staging

# Trigger: setiap kali CI check selesai di PR
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

jobs:
  # ═══════════════════════════════════════════════════════════
  # Auto-label PR berdasarkan branch name
  # ═══════════════════════════════════════════════════════════
  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Label berdasarkan nama branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labels = [];

            if (branch.startsWith('feat/'))   labels.push('feature');
            if (branch.startsWith('fix/'))    labels.push('bug-fix');
            if (branch.startsWith('chore/'))  labels.push('chore');
            if (branch.startsWith('hotfix/')) labels.push('hotfix');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
              });
            }

  # ═══════════════════════════════════════════════════════════
  # Auto-merge setelah semua checks hijau
  # ═══════════════════════════════════════════════════════════
  auto-merge:
    name: Auto-Merge ke Staging
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.base_ref == 'staging'
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Tunggu semua CI checks selesai
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Match the exact quality checks; check-name treats multiline input as one name.
          check-regexp: "^(Frontend Quality|Admin Service Quality|Auth Service Quality|Routing Service Quality)$"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          # Timeout 20 menit
          allowed-conclusions: success,skipped

      - name: Enable auto-merge (squash)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Cek semua checks sudah pass
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });
            
            const failed = checks.data.check_runs.filter(
              c => c.conclusion === 'failure' || c.conclusion === 'cancelled'
            );
            
            if (failed.length > 0) {
              core.setFailed(`❌ Ada ${failed.length} check gagal: ${failed.map(c => c.name).join(', ')}`);
              return;
            }
            
            // Merge dengan squash (satu commit bersih ke staging)
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`,
              commit_message: `Auto-merged via CI/CD\n\nBranch: ${pr.head.ref}\nAuthor: ${pr.user.login}`,
            });
            
            console.log(`✅ PR #${pr.number} berhasil di-merge ke staging!`);

      - name: Comment sukses di PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 **Auto-Merge Berhasil!**\n\nSemua CI checks hijau. PR ini sudah di-merge ke \`staging\` secara otomatis.\n\n> Staging pipeline sedang berjalan → [Lihat Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions)`,
            });

      - name: Comment gagal di PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **Auto-Merge Gagal**\n\nAda CI check yang belum pass. Perbaiki error terlebih dahulu, lalu push ulang.\n\n> [Lihat detail error di Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})`,
            });
