name: TIRE005 roadside settlement wiring
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/tmp-tire005-roadside-settlement.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Sync staging
        run: git pull --ff-only origin staging
      - name: Wire authoritative settlement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/order-service/cmd/api/main.go')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'anchor missing: {old!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '\tsettlementRepo := repository.NewSettlementRepository(db)\n\tavailabilityRepo := repository.NewAvailabilityRepository(db)',
              '\tsettlementRepo := repository.NewSettlementRepository(db)\n\troadsideSettlementSourceRepo := repository.NewRoadsideSettlementSourceRepository(db)\n\tavailabilityRepo := repository.NewAvailabilityRepository(db)'
          )
          replace_once(
              '\tsettlementSvc := service.NewSettlementService(settlementRepo)\n\tavailabilitySvc := service.NewAvailabilityService(availabilityRepo)',
              '\tsettlementSvc := service.NewSettlementService(settlementRepo)\n\troadsideSettlementSvc := service.NewRoadsideSettlementService(roadsideSettlementSourceRepo, settlementRepo)\n\tavailabilitySvc := service.NewAvailabilityService(availabilityRepo)'
          )
          replace_once(
              '\tserviceAdjustmentHandler := handler.NewServiceAdjustmentHandler(serviceAdjustmentSvc)\n\ttowingClaimRepo := repository.NewTowingDamageClaimRepository(db)',
              '\tserviceAdjustmentHandler := handler.NewServiceAdjustmentHandler(serviceAdjustmentSvc)\n\troadsideSettlementHandler := handler.NewRoadsideSettlementHandler(roadsideSettlementSvc)\n\ttowingClaimRepo := repository.NewTowingDamageClaimRepository(db)'
          )
          replace_once(
              'mux.HandleFunc("/api/v1/order/settlement", middleware.BaseChain(middleware.AuthMiddleware(tambalBanHandler.CalculateSettlement)))',
              'mux.HandleFunc("/api/v1/order/settlement", middleware.BaseChain(middleware.AuthMiddleware(roadsideSettlementHandler.Calculate)))'
          )
          p.write_text(s)
          PY
      - name: Go format
        run: |
          cd backend/order-service
          gofmt -w cmd/api/main.go internal/handler/roadside_settlement_handler.go internal/handler/roadside_settlement_handler_test.go internal/service/roadside_settlement_service.go internal/service/roadside_settlement_service_test.go
      - name: Run targeted TIRE005 verification
        id: tire_tests
        continue-on-error: true
        shell: bash
        run: |
          cd backend/order-service
          set +e
          {
            echo '== roadside settlement handler =='
            go test internal/handler/roadside_settlement_handler.go internal/handler/roadside_settlement_handler_test.go
            handler_status=$?
            echo '== roadside settlement service =='
            go test internal/service/roadside_settlement_service.go internal/service/roadside_settlement_service_test.go
            service_status=$?
            echo '== runtime wiring compile =='
            go test ./cmd/api -run '^$'
            wiring_status=$?
            if [ "$handler_status" -ne 0 ] || [ "$service_status" -ne 0 ] || [ "$wiring_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee "$RUNNER_TEMP/tire005-go-test.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload TIRE005 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tire005-go-test-diagnostics
          path: ${{ runner.temp }}/tire005-go-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop on TIRE005 verification failure
        if: steps.tire_tests.outcome != 'success'
        run: exit 1
      - name: Commit and push directly to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tire005-roadside-settlement.yml
          git add backend/order-service/cmd/api/main.go backend/order-service/internal/handler/roadside_settlement_handler.go backend/order-service/internal/handler/roadside_settlement_handler_test.go backend/order-service/internal/service/roadside_settlement_service.go backend/order-service/internal/service/roadside_settlement_service_test.go
          git commit -m 'fix: gate roadside settlement behind final proof'
          for attempt in 1 2 3; do
            git pull --rebase origin staging
            if git push origin HEAD:staging; then exit 0; fi
            sleep 2
          done
          exit 1
