basePath: /api/v1
definitions:
  lancar_auth-service_internal_domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_2fa_enabled:
        type: boolean
      is_verified:
        type: boolean
      last_login_at:
        type: string
      phone_number:
        type: string
      photo_url:
        type: string
      referral_code:
        type: string
      referred_by:
        type: string
      role:
        $ref: '#/definitions/lancar_auth-service_internal_domain.UserRole'
      status:
        $ref: '#/definitions/lancar_auth-service_internal_domain.UserStatus'
      updated_at:
        type: string
    type: object
  lancar_auth-service_internal_domain.UserRole:
    enum:
    - customer
    - courier
    - admin
    - super_admin
    - finance
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleCourier
    - RoleAdmin
    - RoleSuperAdmin
    - RoleFinance
  lancar_auth-service_internal_domain.UserStatus:
    enum:
    - active
    - inactive
    - suspended
    - pending_verification
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusSuspended
    - StatusPendingVerification
  lancar_auth-service_internal_service.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      is_new_user:
        type: boolean
      mfa_user_id:
        type: string
      refresh_token:
        type: string
      require_2fa:
        type: boolean
      user:
        $ref: '#/definitions/lancar_auth-service_internal_domain.User'
    type: object
host: localhost:8081
info:
  contact:
    email: support@lancar.id
    name: API Support
    url: http://www.lancar.id/support
  description: API for Authentication, Courier Onboarding, and User Management.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: LANCAR Identity Service API
  version: "1.0"
paths:
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate refresh token
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout (Mobile)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lancar_auth-service_internal_service.AuthResponse'
      summary: Refresh Token (Mobile)
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Update user details after first login
      parameters:
      - description: Registration Details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update Profile / Register (Mobile)
      tags:
      - auth
  /auth/request-otp:
    post:
      consumes:
      - application/json
      description: Send OTP to phone number
      parameters:
      - description: Phone Number
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request OTP (Mobile)
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify OTP and receive JWT tokens
      parameters:
      - description: OTP Verification
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lancar_auth-service_internal_service.AuthResponse'
      summary: Verify OTP (Mobile)
      tags:
      - auth
  /couriers/documents:
    post:
      consumes:
      - multipart/form-data
      description: Upload SIM, STNK, or KTP for verification
      parameters:
      - description: Type of document (sim, stnk, ktp)
        in: formData
        name: document_type
        required: true
        type: string
      - description: Document file
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Upload Courier Documents (Mobile)
      tags:
      - couriers
  /couriers/liveness:
    post:
      consumes:
      - application/json
      description: Verify courier is a real person via face capture
      parameters:
      - description: Liveness Image
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Courier Liveness Verification (Mobile)
      tags:
      - couriers
  /couriers/register:
    post:
      consumes:
      - application/json
      description: Upgrade customer account to courier account
      parameters:
      - description: Courier Details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Register as Courier (Mobile)
      tags:
      - couriers
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
