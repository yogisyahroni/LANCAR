# ============================================================
# TEMBUS — Docker Compose (Local Development)
# Jalankan: docker compose up -d
# Stop:     docker compose down
# Reset DB: docker compose down -v && docker compose up -d
# ============================================================

services:

  # ─────────────────────────────────────────────
  # DATABASE — PostgreSQL 15 + PostGIS (Primary)
  # ─────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: tembus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-tembus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tembus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tembus}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # READ REPLICA (Simulated)
  # ─────────────────────────────────────────────
  db-read:
    image: postgis/postgis:15-3.4-alpine
    container_name: tembus-db-read
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-tembus}
    # In a real setup, we'd configure replication here. 
    # For dev, we just provide a second instance.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # PGBOUNCER — Production-like connection pooler
  # Enable with: docker compose --profile scale up -d pgbouncer
  # ─────────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1.24.0
    container_name: tembus-pgbouncer
    restart: unless-stopped
    profiles:
      - scale
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-tembus}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-80}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-20}
      PGBOUNCER_QUERY_TIMEOUT: ${PGBOUNCER_QUERY_TIMEOUT:-15000}
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # CACHE — Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tembus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tembus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # MIGRATION RUNNER — goose
  # ─────────────────────────────────────────────
  migrate:
    image: ghcr.io/pressly/goose:latest
    container_name: tembus-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations
    command: >
      -dir /migrations
      postgres
      "host=db port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-1234} dbname=${POSTGRES_DB:-tembus} sslmode=disable"
      up
    networks:
      - tembus-net
    profiles:
      - migrate

  # ─────────────────────────────────────────────
  # AUTH SERVICE — Go 1.24
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: tembus-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_PORT: ${AUTH_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_min32chars}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ADMIN SERVICE — Node.js / TypeScript
  # ─────────────────────────────────────────────
  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: tembus-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "${ADMIN_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public}"
      READ_DATABASE_URL: "${ADMIN_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public}"
      REDIS_URL: "redis://redis:6379"
      SOCKET_REDIS_ADAPTER_ENABLED: ${SOCKET_REDIS_ADAPTER_ENABLED:-true}
      PG_POOL_MAX: ${ADMIN_PG_POOL_MAX:-20}
      PG_READ_POOL_MAX: ${ADMIN_PG_READ_POOL_MAX:-30}
      PG_POOL_IDLE_TIMEOUT_MS: ${PG_POOL_IDLE_TIMEOUT_MS:-30000}
      PG_POOL_CONNECTION_TIMEOUT_MS: ${PG_POOL_CONNECTION_TIMEOUT_MS:-5000}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-15000}
      PG_QUERY_TIMEOUT_MS: ${PG_QUERY_TIMEOUT_MS:-15000}
      PG_APPLICATION_NAME: ${PG_APPLICATION_NAME:-tembus-admin}
      EVENT_OUTBOX_WORKER_ENABLED: ${EVENT_OUTBOX_WORKER_ENABLED:-true}
      EVENT_OUTBOX_INTERVAL_MS: ${EVENT_OUTBOX_INTERVAL_MS:-1000}
      EVENT_OUTBOX_BATCH_SIZE: ${EVENT_OUTBOX_BATCH_SIZE:-100}
      OUTBOX_RABBITMQ_ENABLED: ${OUTBOX_RABBITMQ_ENABLED:-false}
      OUTBOX_RABBITMQ_EXCHANGE: ${OUTBOX_RABBITMQ_EXCHANGE:-tembus.events}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      ROUTE_PRICING_CACHE_TTL_SECONDS: ${ROUTE_PRICING_CACHE_TTL_SECONDS:-300}
      ROUTE_PRICING_STALE_CACHE_TTL_SECONDS: ${ROUTE_PRICING_STALE_CACHE_TTL_SECONDS:-86400}
      MAPS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${MAPS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
      MAPS_PROVIDER_CIRCUIT_OPEN_SECONDS: ${MAPS_PROVIDER_CIRCUIT_OPEN_SECONDS:-30}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_DB: "true"
      DEV_SEEDED_COURIER_PIN: ${DEV_SEEDED_COURIER_PIN:-kurir123}
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      MIDTRANS_FINISH_URL: ${MIDTRANS_FINISH_URL:-http://localhost:3000/orders}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_DIRECTIONS_API_KEY: ${GOOGLE_DIRECTIONS_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CUSTOMER_SERVICE_ACCOUNT: ${FIREBASE_CUSTOMER_SERVICE_ACCOUNT:-}
      FIREBASE_CUSTOMER_SERVICE_ACCOUNT_B64: ${FIREBASE_CUSTOMER_SERVICE_ACCOUNT_B64:-}
      FIREBASE_CUSTOMER_PROJECT_ID: ${FIREBASE_CUSTOMER_PROJECT_ID:-}
      FIREBASE_COURIER_SERVICE_ACCOUNT: ${FIREBASE_COURIER_SERVICE_ACCOUNT:-}
      FIREBASE_COURIER_SERVICE_ACCOUNT_B64: ${FIREBASE_COURIER_SERVICE_ACCOUNT_B64:-}
      FIREBASE_COURIER_PROJECT_ID: ${FIREBASE_COURIER_PROJECT_ID:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    volumes:
      - tembus-admin-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ROUTING SERVICE — Go (Feature Flags, future HTTP)
  # ─────────────────────────────────────────────
  routing-service:
    build:
      context: ./backend/routing-service
      dockerfile: Dockerfile
    container_name: tembus-routing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      ROUTING_PORT: 8082
      ROUTING_SERVICE_PORT: 8082
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${ROUTING_HOST_PORT:-18082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ORDER SERVICE — Go (Pricing Engine + Order MGMT)
  # ─────────────────────────────────────────────
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: tembus-order
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      ORDER_PORT: ${ORDER_PORT:-8083}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_DIRECTIONS_API_KEY: ${GOOGLE_DIRECTIONS_API_KEY:-}
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
    ports:
      - "${ORDER_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # PAYMENT SERVICE — Go (Wallet & Fees)
  # ─────────────────────────────────────────────
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: tembus-payment
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      PAYMENT_PORT: ${PAYMENT_PORT:-8084}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${PAYMENT_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net


  # ─────────────────────────────────────────────
  # REDIS COMMANDER — Web UI untuk Redis (dev only)
  # ─────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tembus-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8085:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tembus-net
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # API GATEWAY — Node.js / Express / Zod
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: tembus-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - order-service
      - admin-service
      - routing-service
      - payment-service
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8081"
      ORDER_SERVICE_URL: "http://order-service:8083"
      ADMIN_SERVICE_URL: "http://admin-service:3000"
      ROUTING_SERVICE_URL: "http://routing-service:8082"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}

    ports:
      - "8080:8080"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js (Customer Portal)
  # Akses: http://localhost:3000
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tembus-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080"
      SERVER_API_URL: "http://api-gateway:8080/api/v1"
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      NEXT_PUBLIC_MIDTRANS_SNAP_URL: ${NEXT_PUBLIC_MIDTRANS_SNAP_URL:-https://app.sandbox.midtrans.com/snap/snap.js}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ADMIN DASHBOARD — Vite / React
  # Akses: http://localhost:3002
  # ─────────────────────────────────────────────
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: tembus-admin-ui
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_URL: "http://localhost:8080/api/v1"
      VITE_WS_URL: "ws://localhost:8080"
    ports:
      - "${ADMIN_DASHBOARD_PORT:-3002}:3001"
    networks:
      - tembus-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tembus-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tembus-db-data:
    name: tembus-db-data
  tembus-redis-data:
    name: tembus-redis-data
  rabbitmq_data:
    name: rabbitmq_data
  tembus-admin-uploads:
    name: tembus-admin-uploads

networks:
  tembus-net:
    name: tembus-net
    driver: bridge
