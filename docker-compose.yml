# ============================================================
# TEMBUS — Docker Compose (Local Development)
# Jalankan: docker compose up -d
# Stop:     docker compose down
# Reset DB: docker compose down -v && docker compose up -d
# ============================================================

name: tembus

services:

  # ─────────────────────────────────────────────
  # DATABASE — PostgreSQL 15 + PostGIS (Primary)
  # ─────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: tembus-db
    restart: unless-stopped
    # ─── PostgreSQL tuning untuk VPS. Sesuaikan postgres-tuning.conf ───────
    # File: database/postgres-tuning.conf (asumsi VPS 8GB RAM, SSD storage)
    command: >
      postgres
      -c config_file=/etc/postgresql/tuning.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-tembus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tembus-db-data:/var/lib/postgresql/data
      - ./database/postgres-tuning.conf:/etc/postgresql/tuning.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tembus}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # READ REPLICA (Simulated)
  # ─────────────────────────────────────────────
  db-read:
    image: postgis/postgis:15-3.4-alpine
    container_name: tembus-db-read
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-tembus}
    # In a real setup, we'd configure replication here. 
    # For dev, we just provide a second instance.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # PGBOUNCER — Production-like connection pooler
  # Enable with: docker compose --profile scale up -d pgbouncer
  # ─────────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1.24.0
    container_name: tembus-pgbouncer
    restart: unless-stopped
    # ─── PgBouncer WAJIB aktif di VPS untuk menghemat RAM ─────────────────
    # Transaction pooling: semua service share pool koneksi ke PostgreSQL.
    # Tanpa ini: 6 service × 20 koneksi = 120 koneksi raw ≈ 1.2GB RAM terbuang.
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-tembus}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-80}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-20}
      PGBOUNCER_QUERY_TIMEOUT: ${PGBOUNCER_QUERY_TIMEOUT:-15000}
      PGBOUNCER_SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-600}
      PGBOUNCER_SERVER_LIFETIME: ${PGBOUNCER_SERVER_LIFETIME:-3600}
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: ${PGBOUNCER_CLIENT_IDLE_TIMEOUT:-0}
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # CACHE — Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tembus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tembus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # OBSERVABILITY — Jaeger UI + OpenTelemetry Collector
  # Jaeger UI: http://localhost:16686
  # ─────────────────────────────────────────────
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.68.0}
    container_name: tembus-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: ${JAEGER_LOG_LEVEL:-info}
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tembus-net

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.128.0}
    container_name: tembus-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    ports:
      - "${OTEL_COLLECTOR_BIND:-127.0.0.1}:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_BIND:-127.0.0.1}:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # MIGRATION RUNNER — goose
  # ─────────────────────────────────────────────
  migrate:
    image: ghcr.io/pressly/goose:latest
    container_name: tembus-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations
    command: >
      -dir /migrations
      postgres
      "host=db port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-1234} dbname=${POSTGRES_DB:-tembus} sslmode=disable"
      up
    networks:
      - tembus-net
    profiles:
      - migrate

  # ─────────────────────────────────────────────
  # AUTH SERVICE — Go 1.25
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: tembus-auth
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # ─── Semua koneksi DB WAJIB via PgBouncer (port 6432) ──────────────
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_PORT: ${AUTH_PORT:-8081}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_min32chars}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      # ─── Integration Gateway ─────────────────────────────────────────────────
      INTEGRATION_GATEWAY_URL: ${INTEGRATION_GATEWAY_URL:-http://integration-gateway:8085}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-tembus_internal_key_secure}
      # ─── OTP Provider (Zenziva WhatsApp/SMS) ───────────────────────────────
      # Set OTP_PROVIDER=zenziva to use the integration-gateway for live OTP.
      # Tanpa OTP_PROVIDER=zenziva, service fallback ke dry-run (OTP di stdout).
      OTP_PROVIDER: ${OTP_PROVIDER:-}
      # ─── OTP Hash Security ─────────────────────────────────────────────────
      # WAJIB diisi di production (min 32 karakter). Tanpa ini OTP tidak aman.
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER:-}
      GOOGLE_CUSTOMER_WEB_CLIENT_ID: ${GOOGLE_CUSTOMER_WEB_CLIENT_ID:-}
      GOOGLE_CUSTOMER_ANDROID_CLIENT_ID: ${GOOGLE_CUSTOMER_ANDROID_CLIENT_ID:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${AUTH_OTEL_SERVICE_NAME:-auth-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # INTEGRATION GATEWAY — Go 1.25 (Anti-Corruption Layer)
  # ─────────────────────────────────────────────
  integration-gateway:
    build:
      context: ./backend/integration-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      INTEGRATION_GATEWAY_PORT: 8085
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-tembus_internal_key_secure}
      ACTIVE_OTP_PROVIDER: ${ACTIVE_OTP_PROVIDER:-zenziva}
      ACTIVE_PAYMENT_PROVIDER: ${ACTIVE_PAYMENT_PROVIDER:-midtrans}
      ACTIVE_MAPS_PROVIDER: ${ACTIVE_MAPS_PROVIDER:-tomtom}
      ZENZIVA_BASE_URL: ${ZENZIVA_BASE_URL:-}
      ZENZIVA_USER_KEY: ${ZENZIVA_USER_KEY:-}
      ZENZIVA_API_KEY: ${ZENZIVA_API_KEY:-}
      ZENZIVA_WHATSAPP_SENDER: ${ZENZIVA_WHATSAPP_SENDER:-}
      ZENZIVA_SMS_SENDER_ID: ${ZENZIVA_SMS_SENDER_ID:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      TOMTOM_SERVER_API_KEY: ${TOMTOM_SERVER_API_KEY:-}
      TOMTOM_ROUTING_API_URL: ${TOMTOM_ROUTING_API_URL:-https://api.tomtom.com/routing/1}
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ADMIN SERVICE — Node.js / TypeScript
  # ─────────────────────────────────────────────
  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: tembus-admin
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "${ADMIN_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public}"
      READ_DATABASE_URL: "${ADMIN_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public}"
      REDIS_URL: "redis://redis:6379"
      SOCKET_REDIS_ADAPTER_ENABLED: ${SOCKET_REDIS_ADAPTER_ENABLED:-true}
      PG_POOL_MAX: ${ADMIN_PG_POOL_MAX:-20}
      PG_READ_POOL_MAX: ${ADMIN_PG_READ_POOL_MAX:-30}
      PG_POOL_IDLE_TIMEOUT_MS: ${PG_POOL_IDLE_TIMEOUT_MS:-30000}
      PG_POOL_CONNECTION_TIMEOUT_MS: ${PG_POOL_CONNECTION_TIMEOUT_MS:-5000}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-15000}
      PG_QUERY_TIMEOUT_MS: ${PG_QUERY_TIMEOUT_MS:-15000}
      PG_APPLICATION_NAME: ${PG_APPLICATION_NAME:-tembus-admin}
      EVENT_OUTBOX_WORKER_ENABLED: ${EVENT_OUTBOX_WORKER_ENABLED:-true}
      EVENT_OUTBOX_INTERVAL_MS: ${EVENT_OUTBOX_INTERVAL_MS:-1000}
      EVENT_OUTBOX_BATCH_SIZE: ${EVENT_OUTBOX_BATCH_SIZE:-100}
      OUTBOX_RABBITMQ_ENABLED: ${OUTBOX_RABBITMQ_ENABLED:-false}
      OUTBOX_RABBITMQ_EXCHANGE: ${OUTBOX_RABBITMQ_EXCHANGE:-tembus.events}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-tembus_mq}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbitmq_in_production}@rabbitmq:5672/"
      ROUTE_PRICING_CACHE_TTL_SECONDS: ${ROUTE_PRICING_CACHE_TTL_SECONDS:-300}
      ROUTE_PRICING_STALE_CACHE_TTL_SECONDS: ${ROUTE_PRICING_STALE_CACHE_TTL_SECONDS:-86400}
      MAPS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${MAPS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
      MAPS_PROVIDER_CIRCUIT_OPEN_SECONDS: ${MAPS_PROVIDER_CIRCUIT_OPEN_SECONDS:-30}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SEED_DB: "true"
      DEV_ADMIN_LOGIN_PASSWORDS: ${DEV_ADMIN_LOGIN_PASSWORDS:-}
      DEV_SEEDED_COURIER_PIN: ${DEV_SEEDED_COURIER_PIN:-kurir123}
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      MIDTRANS_FINISH_URL: ${MIDTRANS_FINISH_URL:-http://localhost:3000/orders}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      RECEIVER_LOCATION_PUBLIC_URL: ${RECEIVER_LOCATION_PUBLIC_URL:-http://localhost:3000/location-requests}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,https://admin.bawain.my.id,https://bawain.my.id}}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
      TOMTOM_SERVER_API_KEY: ${TOMTOM_SERVER_API_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_WEB_API_KEY: ${TOMTOM_WEB_API_KEY:-}
      TOMTOM_PUBLIC_API_KEY: ${TOMTOM_PUBLIC_API_KEY:-}
      TOMTOM_MAP_STYLE: ${TOMTOM_MAP_STYLE:-}
      TOMTOM_ROUTING_API_URL: ${TOMTOM_ROUTING_API_URL:-https://api.tomtom.com/routing/1}
      TOMTOM_SEARCH_API_URL: ${TOMTOM_SEARCH_API_URL:-https://api.tomtom.com/search/2}
      MAPS_CREDENTIAL_ENCRYPTION_KEY: ${MAPS_CREDENTIAL_ENCRYPTION_KEY:-}
      MAPS_RUNTIME_CREDENTIAL_CACHE_TTL_SECONDS: ${MAPS_RUNTIME_CREDENTIAL_CACHE_TTL_SECONDS:-30}
      TOMTOM_SERVER_KEY_CONFIGURED: ${TOMTOM_SERVER_KEY_CONFIGURED:-false}
      TOMTOM_SERVER_KEY_ALIAS: ${TOMTOM_SERVER_KEY_ALIAS:-tembus-staging-server-maps-key}
      TOMTOM_SERVER_KEY_RESTRICTION: ${TOMTOM_SERVER_KEY_RESTRICTION:-server_ip}
      TOMTOM_SERVER_KEY_APIS: ${TOMTOM_SERVER_KEY_APIS:-routing,search,reverse_geocoding,traffic}
      TOMTOM_SERVER_KEY_ROTATED_AT: ${TOMTOM_SERVER_KEY_ROTATED_AT:-}
      TOMTOM_ANDROID_COURIER_KEY_CONFIGURED: ${TOMTOM_ANDROID_COURIER_KEY_CONFIGURED:-false}
      TOMTOM_ANDROID_COURIER_KEY_ALIAS: ${TOMTOM_ANDROID_COURIER_KEY_ALIAS:-tembus-staging-android-courier-maps-key}
      TOMTOM_ANDROID_COURIER_KEY_RESTRICTION: ${TOMTOM_ANDROID_COURIER_KEY_RESTRICTION:-android_package_sha1}
      TOMTOM_ANDROID_COURIER_KEY_APIS: ${TOMTOM_ANDROID_COURIER_KEY_APIS:-maps_sdk_android,navigation_sdk_android}
      TOMTOM_ANDROID_COURIER_KEY_ROTATED_AT: ${TOMTOM_ANDROID_COURIER_KEY_ROTATED_AT:-}
      TOMTOM_ANDROID_CUSTOMER_KEY_CONFIGURED: ${TOMTOM_ANDROID_CUSTOMER_KEY_CONFIGURED:-false}
      TOMTOM_ANDROID_CUSTOMER_KEY_ALIAS: ${TOMTOM_ANDROID_CUSTOMER_KEY_ALIAS:-tembus-staging-android-customer-maps-key}
      TOMTOM_ANDROID_CUSTOMER_KEY_RESTRICTION: ${TOMTOM_ANDROID_CUSTOMER_KEY_RESTRICTION:-android_package_sha1}
      TOMTOM_ANDROID_CUSTOMER_KEY_APIS: ${TOMTOM_ANDROID_CUSTOMER_KEY_APIS:-maps_sdk_android}
      TOMTOM_ANDROID_CUSTOMER_KEY_ROTATED_AT: ${TOMTOM_ANDROID_CUSTOMER_KEY_ROTATED_AT:-}
      TOMTOM_WEB_KEY_CONFIGURED: ${TOMTOM_WEB_KEY_CONFIGURED:-false}
      TOMTOM_WEB_KEY_ALIAS: ${TOMTOM_WEB_KEY_ALIAS:-tembus-staging-web-maps-key}
      TOMTOM_WEB_KEY_RESTRICTION: ${TOMTOM_WEB_KEY_RESTRICTION:-http_referrer}
      TOMTOM_WEB_KEY_APIS: ${TOMTOM_WEB_KEY_APIS:-maps_sdk_web}
      TOMTOM_WEB_KEY_ROTATED_AT: ${TOMTOM_WEB_KEY_ROTATED_AT:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CUSTOMER_SERVICE_ACCOUNT: ${FIREBASE_CUSTOMER_SERVICE_ACCOUNT:-}
      FIREBASE_CUSTOMER_SERVICE_ACCOUNT_B64: ${FIREBASE_CUSTOMER_SERVICE_ACCOUNT_B64:-}
      FIREBASE_CUSTOMER_PROJECT_ID: ${FIREBASE_CUSTOMER_PROJECT_ID:-}
      FIREBASE_COURIER_SERVICE_ACCOUNT: ${FIREBASE_COURIER_SERVICE_ACCOUNT:-}
      FIREBASE_COURIER_SERVICE_ACCOUNT_B64: ${FIREBASE_COURIER_SERVICE_ACCOUNT_B64:-}
      FIREBASE_COURIER_PROJECT_ID: ${FIREBASE_COURIER_PROJECT_ID:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # ─── Persistent file storage (foto kurir, dokumen, dll.) ───────────────
      # Path ini harus sama dengan volume mount di bawah (/app/public/uploads)
      # agar file tidak hilang saat container di-restart atau di-recreate.
      UPLOAD_PRIVATE_DIR: /app/public/uploads
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${ADMIN_OTEL_SERVICE_NAME:-admin-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    volumes:
      - tembus-admin-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ROUTING SERVICE — Go (Feature Flags, future HTTP)
  # ─────────────────────────────────────────────
  routing-service:
    build:
      context: ./backend/routing-service
      dockerfile: Dockerfile
    container_name: tembus-routing
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      ROUTING_PORT: 8082
      ROUTING_SERVICE_PORT: 8082
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${ROUTING_OTEL_SERVICE_NAME:-routing-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "${ROUTING_HOST_PORT:-18082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ORDER SERVICE — Go (Pricing Engine + Order MGMT)
  # ─────────────────────────────────────────────
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: tembus-order
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-read:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      ORDER_PORT: ${ORDER_PORT:-8083}
      TOMTOM_SERVER_API_KEY: ${TOMTOM_SERVER_API_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_ROUTING_API_URL: ${TOMTOM_ROUTING_API_URL:-https://api.tomtom.com/routing/1}
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-tembus_mq}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbitmq_in_production}@rabbitmq:5672/"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
    ports:
      - "${ORDER_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # PAYMENT SERVICE — Go (Wallet & Fees)
  # ─────────────────────────────────────────────
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: tembus-payment
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@pgbouncer:6432/${POSTGRES_DB:-tembus}?sslmode=disable&search_path=public"
      REDIS_URL: "redis://redis:6379"
      PAYMENT_PORT: ${PAYMENT_PORT:-8084}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${PAYMENT_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tembus-net
  # ─────────────────────────────────────────────
  # REDIS COMMANDER — Web UI untuk Redis (dev only)
  # ─────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tembus-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8085:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tembus-net
    profiles:
      - tools

  # ─────────────────────────────────────────────
  # API GATEWAY — Node.js / Express / Zod
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: tembus-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - order-service
      - admin-service
      - routing-service
      - payment-service
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8081"
      ORDER_SERVICE_URL: "http://order-service:8083"
      ADMIN_SERVICE_URL: "http://admin-service:3000"
      ROUTING_SERVICE_URL: "http://routing-service:8082"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
      GATEWAY_PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,https://admin.bawain.my.id,https://bawain.my.id}}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_min32chars}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${GATEWAY_OTEL_SERVICE_NAME:-api-gateway}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

    ports:
      - "8080:8080"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # LANDING PAGE — Next.js (Public Marketing Site)
  # Akses: http://localhost:3003
  # Tunnel domain target: https://bawain.my.id
  # ─────────────────────────────────────────────
  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: tembus-landing-page
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${LANDING_PORT:-3003}:3000"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js (Customer Portal)
  # Akses: http://localhost:3000
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8080}
        NEXT_PUBLIC_ALLOW_LOCALHOST_FALLBACK: "true"
    container_name: tembus-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8080}
      NEXT_PUBLIC_ALLOW_LOCALHOST_FALLBACK: "true"
      SERVER_API_URL: ${SERVER_API_URL:-http://api-gateway:8080/api/v1}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      NEXT_PUBLIC_MIDTRANS_SNAP_URL: ${NEXT_PUBLIC_MIDTRANS_SNAP_URL:-https://app.sandbox.midtrans.com/snap/snap.js}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # ADMIN DASHBOARD — Vite / React
  # Akses: http://localhost:3002
  # ─────────────────────────────────────────────
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:8080}
        VITE_ALLOW_LOCALHOST_FALLBACK: "true"
    container_name: tembus-admin-ui
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:8080}
      VITE_ALLOW_LOCALHOST_FALLBACK: "true"
    ports:
      - "${ADMIN_DASHBOARD_PORT:-3002}:3001"
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # DATALAKE WORKER — Go 1.25
  # Worker untuk membaca message GPS dari RabbitMQ dan simpan ke Cloudflare R2
  # ─────────────────────────────────────────────
  datalake-worker:
    build:
      context: ./backend/datalake-worker
      dockerfile: Dockerfile
    container_name: tembus-datalake-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-tembus_mq}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbitmq_in_production}@rabbitmq:5672/"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-lancar-ai-datalake}
    networks:
      - tembus-net

  # ─────────────────────────────────────────────
  # MESSAGE BROKER — RabbitMQ 3.13 Alpine
  # Management UI: http://localhost:15672 (dev only, loopback-bound)
  # S2-INF-01: Pinned to versioned alpine tag — smaller attack surface vs full image.
  # Credentials pulled from env-vars; never use default guest:guest.
  # ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tembus-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-127.0.0.1:5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-127.0.0.1:15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tembus_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbitmq_in_production}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tembus-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  tembus-db-data:
    name: tembus-db-data
  tembus-redis-data:
    name: tembus-redis-data
  rabbitmq_data:
    name: rabbitmq_data
  tembus-admin-uploads:
    name: tembus-admin-uploads

networks:
  tembus-net:
    name: tembus-net
    driver: bridge
