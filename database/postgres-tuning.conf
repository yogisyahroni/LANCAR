# ============================================================
# PostgreSQL Tuning — TEMBUS Platform (VPS 4GB RAM)
# Generated: 2026-07-08
# Spec target: VPS 4GB RAM, SSD storage, ~120 max connections via PgBouncer
#
# PENTING: File ini di-mount ke container PostgreSQL.
# Untuk VPS RAM berbeda, sesuaikan sesuai rumus:
#   shared_buffers      = 25% total RAM
#   effective_cache_size = 75% total RAM
#   work_mem            = (RAM - shared_buffers) / max_connections / 2
# ============================================================

# ──────────────────────────────────────────────────────────
# MEMORY SETTINGS
# ──────────────────────────────────────────────────────────

# Cache data pages di shared memory. Aturan: 25% total RAM.
# VPS 4GB → 1GB. Sesuaikan: 8GB RAM=2GB | 16GB RAM=4GB
shared_buffers = 1GB

# Estimasi total memory yang tersedia untuk caching disk.
# Dipakai query planner untuk memilih index scan vs seq scan.
# Aturan: 75% total RAM.
effective_cache_size = 3GB

# Memory per sort/hash operation PER QUERY. Hati-hati: nilai tinggi
# dikalikan parallel workers dan koneksi aktif.
# Dengan PgBouncer transaction mode & 100 max_conn + 4GB: 8MB aman.
work_mem = 8MB

# Memory untuk operasi maintenance: CREATE INDEX, VACUUM, ALTER TABLE.
# Tidak dikalikan koneksi, jadi bisa lebih besar.
maintenance_work_mem = 128MB

# Shared memory untuk huge pages (Linux VPS). Meningkatkan performa TLB.
# Aktifkan jika OS sudah dikonfigurasi dengan huge pages.
# huge_pages = try

# ──────────────────────────────────────────────────────────
# CONNECTION SETTINGS
# ──────────────────────────────────────────────────────────

# PgBouncer mengelola koneksi client. PostgreSQL hanya butuh sedikit.
# 100 koneksi cukup untuk semua microservices via pooler.
# Di VPS 4GB: lebih ketat — limit 80 koneksi PostgreSQL langsung.
# (PgBouncer PGBOUNCER_DEFAULT_POOL_SIZE=60 + 20 reserve = 80)
listen_addresses = '*'
max_connections = 100

# ──────────────────────────────────────────────────────────
# WAL & CHECKPOINT SETTINGS
# ──────────────────────────────────────────────────────────

# Buffer untuk Write-Ahead Log. 64MB adalah sweet spot untuk throughput.
wal_buffers = 64MB

# Seberapa lama PostgreSQL menunda checkpoint untuk menyebarkan I/O.
# 0.9 = spread over 90% of checkpoint interval → smoother disk I/O.
checkpoint_completion_target = 0.9

# Interval antar checkpoint dalam WAL. Lebih besar = lebih jarang checkpoint
# tapi recovery lebih lama setelah crash. 256MB aman untuk VPS SSD.
max_wal_size = 4GB
min_wal_size = 1GB

# ──────────────────────────────────────────────────────────
# QUERY PLANNER — OPTIMALKAN UNTUK SSD VPS
# ──────────────────────────────────────────────────────────

# Random page cost untuk SSD vs HDD. SSD = 1.1, HDD = 4.0 (default).
# Nilai rendah → planner lebih suka index scan (bagus untuk SSD).
random_page_cost = 1.1

# Jumlah operasi I/O concurrent yang bisa dilakukan SSD.
# SSD NVMe: 200-300. SSD SATA: 100-200. HDD: 2.
effective_io_concurrency = 200

# ──────────────────────────────────────────────────────────
# PARALLEL QUERY
# ──────────────────────────────────────────────────────────

# Jumlah max worker untuk parallel query. Sesuaikan dengan vCPU VPS.
# Untuk VPS 4GB biasanya 2 vCPU: max_parallel_workers_per_gather = 1
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# ──────────────────────────────────────────────────────────
# LOGGING — Bantu debug slow queries di VPS
# ──────────────────────────────────────────────────────────

# Log query yang lebih lambat dari threshold. 500ms aman untuk produksi.
log_min_duration_statement = 500

# Log checkpoint events untuk monitoring disk I/O
log_checkpoints = on

# Log koneksi & disconneksi (matikan di high-traffic production)
log_connections = off
log_disconnections = off

# ──────────────────────────────────────────────────────────
# AUTOVACUUM — Sangat penting untuk PostGIS & tabel GPS log
# ──────────────────────────────────────────────────────────

# Aktifkan autovacuum (Wajib ON untuk menjaga kapasitas disk & performa query)
autovacuum = on

# Vacuum lebih agresif untuk tabel transaksi & log yang sering di-INSERT/UPDATE
autovacuum_vacuum_scale_factor = 0.05       # default 0.2
autovacuum_analyze_scale_factor = 0.025     # default 0.1
autovacuum_naptime = 30s                    # default 1min (cek tiap 30 detik)
autovacuum_vacuum_cost_limit = 200          # batas cost agar tidak membebani CPU VPS

# Maksimum worker autovacuum untuk VPS 4GB RAM (2 vCPU)
autovacuum_max_workers = 2

# ──────────────────────────────────────────────────────────
# MONITORING — pg_stat_statements (sudah diaktifkan via extension)
# ──────────────────────────────────────────────────────────

# Track top-level dan nested statements
pg_stat_statements.track = all

# Shared preload: pastikan pg_stat_statements di-load
shared_preload_libraries = 'pg_stat_statements'
