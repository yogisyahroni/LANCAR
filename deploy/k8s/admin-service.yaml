apiVersion: v1
kind: ConfigMap
metadata:
  name: lancar-admin-service-config
  labels:
    app.kubernetes.io/name: lancar-admin-service
    app.kubernetes.io/part-of: lancar-platform
data:
  NODE_ENV: "production"
  ADMIN_PORT: "3000"
  PG_POOL_MAX: "20"
  PG_READ_POOL_MAX: "40"
  PG_STATEMENT_TIMEOUT_MS: "15000"
  PG_QUERY_TIMEOUT_MS: "15000"
  SOCKET_REDIS_ADAPTER_ENABLED: "true"
  EVENT_OUTBOX_WORKER_ENABLED: "true"
  EVENT_OUTBOX_INTERVAL_MS: "1000"
  EVENT_OUTBOX_BATCH_SIZE: "200"
  OUTBOX_RABBITMQ_ENABLED: "true"
  OUTBOX_RABBITMQ_EXCHANGE: "lancar.events"
  ROUTE_PRICING_CACHE_TTL_SECONDS: "300"
  ROUTE_PRICING_STALE_CACHE_TTL_SECONDS: "86400"
  MAPS_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "5"
  MAPS_PROVIDER_CIRCUIT_OPEN_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lancar-admin-service
  labels:
    app.kubernetes.io/name: lancar-admin-service
    app.kubernetes.io/part-of: lancar-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lancar-admin-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lancar-admin-service
        app.kubernetes.io/part-of: lancar-platform
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: admin-service
          image: ghcr.io/yogisyahroni/lancar-admin-service:staging
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: lancar-admin-service-config
            - secretRef:
                name: lancar-admin-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: lancar-admin-service
  labels:
    app.kubernetes.io/name: lancar-admin-service
    app.kubernetes.io/part-of: lancar-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lancar-admin-service
  ports:
    - name: http
      port: 3000
      targetPort: http
