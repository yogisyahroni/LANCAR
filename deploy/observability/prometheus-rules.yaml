groups:
  - name: lancar-scale-guardrails
    rules:
      - alert: LancarHighOrderCreateLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route=~".*orders.*",method="POST"}[5m])) by (le, route)) > 0.75
        for: 10m
        labels:
          severity: warning
          service: admin-service
        annotations:
          summary: "P95 create-order latency melewati 750ms"
          description: "Audit DB lock, idempotency replay, route pricing cache, dan queue lag sebelum user merasakan delay."
      - alert: LancarDbConnectionSaturation
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.75
        for: 5m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "Koneksi Postgres mendekati saturasi"
          description: "Naikkan PgBouncer pool, cek koneksi bocor, atau kurangi fanout query read/write."
      - alert: LancarRouteProviderFailureSpike
        expr: sum(rate(lancar_maps_provider_failures_total[5m])) > 10
        for: 5m
        labels:
          severity: critical
          service: maps-runtime
        annotations:
          summary: "Kegagalan provider route tinggi"
          description: "Circuit breaker mungkin aktif. Cek quota Google, OSRM/OSM latency, dan stale-cache hit rate."
      - alert: LancarRabbitMqBacklogHigh
        expr: rabbitmq_queue_messages_ready{queue=~"lancar\\..*"} > 50000
        for: 10m
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: "RabbitMQ backlog tinggi"
          description: "Scale worker fleet, cek DLQ, dan audit provider downstream yang melambat."
      - alert: LancarDuplicateIdempotencyConflictSpike
        expr: sum(rate(http_requests_total{code="409",error_code="IDEMPOTENCY_KEY_CONFLICT"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Konflik idempotency meningkat"
          description: "Ada client memakai key yang sama untuk payload berbeda. Audit SDK mobile/web dan retry policy."
      - alert: LancarWebsocketAuthFailureSpike
        expr: sum(rate(socketio_auth_failures_total[5m])) > 20
        for: 5m
        labels:
          severity: warning
          service: realtime
        annotations:
          summary: "WebSocket auth failures meningkat"
          description: "Cek token expiry, refresh flow, dan skew waktu device."
