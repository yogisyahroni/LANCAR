################## Auto generated + statement_flush FIX ##################
[databases]
tembus = host=db port=5432 auth_user=postgres
# FIX 2026-08-11: lib/pq (Go) kirim Parse/Bind extended protocol; pgbouncer
# transaction pooling memecah state → "unnamed prepared statement does not
# exist (26000)". Service Go pakai DB ini (pool_mode=session) → 1 client conn
# = 1 server conn selama session → prepared statements selalu konsisten.
tembus_session = host=db port=5432 dbname=tembus auth_user=postgres pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = 
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
pool_mode = transaction
ignore_startup_parameters = extra_float_digits,search_path,statement_timeout,options,max_prepared_statements

# Log settings
admin_users = postgres

# Connection sanity checks, timeouts
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
default_pool_size = 60
reserve_pool_size = 15
query_timeout = 15000

# TLS settings

# Dangerous timeouts
