services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=${COTURN_MIN_PORT:-49160}
      - --max-port=${COTURN_MAX_PORT:-49260}
      - --realm=${COTURN_REALM:-turn.tembus.local}
      - --server-name=${COTURN_SERVER_NAME:-turn.tembus.local}
      - --use-auth-secret
      - --static-auth-secret=${COTURN_STATIC_AUTH_SECRET:?COTURN_STATIC_AUTH_SECRET is required}
      - --cert=${COTURN_TLS_CERT_PATH:-/etc/coturn/tls/fullchain.pem}
      - --pkey=${COTURN_TLS_KEY_PATH:-/etc/coturn/tls/privkey.pem}
      - --fingerprint
      - --lt-cred-mech
      - --no-multicast-peers
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --mobility
      - --prometheus
      - --log-file=stdout
    volumes:
      - ${COTURN_TLS_DIR:-./tls}:/etc/coturn/tls:ro
    environment:
      COTURN_STATIC_AUTH_SECRET: ${COTURN_STATIC_AUTH_SECRET:?COTURN_STATIC_AUTH_SECRET is required}
